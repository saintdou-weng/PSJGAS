.cloud-toolbar-status,.cloud-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}

  function status(){
    if(cloud.busy)return [T('同步處理中…','Working…','កំពុងដំណើរការ…'),'amber'];
    if(cloud.error)return [T('請查看同步狀態','Check sync status','ពិនិត្យសមកាលកម្ម'),'amber'];
    if(!cloud.checked)return [cloud.endpoint?T('等待驗證連線','Connection needs verification','រង់ចាំផ្ទៀងផ្ទាត់'):T('雲端尚未設定','Cloud not configured','ពពកមិនទាន់កំណត់'),'gray'];
    if(cloud.dirty)return [T('有變更待上傳','Local changes to upload','មានការផ្លាស់ប្តូរត្រូវផ្ទុក'),'amber'];
    if(cloud.lastSync)return [T('已同步','Synced','បានសមកាលកម្ម')+' · '+ict(cloud.lastSync),'teal'];
    return [T('已連線，待下載','Connected · download to load records','បានភ្ជាប់ · ទាញយកកំណត់ត្រា'),'teal'];

      '<div class="cloud-actions">'+button(T('上傳','Upload','ផ្ទុកឡើង'),'cloud-upload','upload','small',disabled)+
      button(T('下載','Download','ទាញយក'),'cloud-download','download','small',disabled)+
      button(T('發摘要','Send summary','ផ្ញើសង្ខេប'),'cloud-summary','file','small',disabled)+
      button(T('雲端設定','Cloud settings','កំណត់ពពក'),'cloud-settings','link','small',disabled)+'</div>'+
      (cloud.error?'<div class="cloud-toolbar-note" role="status">'+esc(cloud.error)+'</div>':'')+'</section>';

  function updateToolbar(){
    const root=document.querySelector('#cloud-slot');
    if(root)root.innerHTML=toolbar();
  }
  function dialogStatus(text,error=false){
    const el=dialog.querySelector('#cloud-dialog-status');
    if(el){el.textContent=text;el.className=error?'cloud-feedback error':'cloud-feedback';}
  }
  function setBusy(busy){
    cloud.busy=busy;updateToolbar();
    for(const el of dialog.querySelectorAll('[data-cloud-operation],#psjga-endpoint,#psjga-key,#psjga-remember'))el.disabled=busy;
  }
  function setDataset(snap,dirty){
    if(!state.snapshot||!sameRows(state.snapshot.records,snap.records)){
      state.page=1;state.selected.clear();
    }
    state.snapshot=snap;state.dataset='snapshot';cloud.dirty=dirty;
    if(!dirty)cloud.backedUp=true;
    storage.set('dataset','snapshot');
  }
  function setMeta(meta){
    cloud.checked=true;cloud.vaultId=meta.vaultId;cloud.remoteRevision=meta.revision;
    cloud.updatedAt=meta.updatedAt;cloud.telegramConfigured=meta.telegramConfigured;
  }
  async function run(fn,{refresh=false,send=false}={}){
    if(cloud.busy)return;
    cloud.error='';setBusy(true);
    try{
      await fn();
      if(refresh&&!state.workspace)render();
    }catch(e){
      if(e?.code==='DEVICE_EXPIRED'&&cloud.key.startsWith('device_')){
        storage.set('cloud_device',null);cloud.key='';cloud.checked=false;cloud.bot=null;pairOutgoing=null;
      }
      cloud.error=send&&e?.code==='TIMEOUT'?T('未收到發送確認。請先到群組查核。','Send confirmation timed out. Check the group first.'):message(e);
      dialogStatus(cloud.error,true);toast(cloud.error);
    }finally{setBusy(false);}
  }
  const request=(action,payload={})=>cloudRequest(cloud.endpoint,cloud.key,action,{vaultId:cloud.vaultId||undefined,...payload});
  async function pull({force=false}={}){
    const knownRevision=!force&&state.snapshot&&cloud.snapshotVault===cloud.vaultId?cloud.revision??undefined:undefined;
    const meta=readCloudMeta(await request('download',{knownRevision}),cloud.snapshotVault||cloud.vaultId);
    if(meta.unchanged){
      if(!state.snapshot||knownRevision!==meta.revision)throw syncError('NOT_PSJGA');
      state.dataset='snapshot';storage.set('dataset','snapshot');
    }else{
      const remote=normalizeCloudSnapshot(meta.snapshot);
      const merged=state.snapshot?mergeSnapshots(remote,state.snapshot):remote;
      const dirty=!sameRows(remote.records,merged.records);
      setDataset(dirty?merged:remote,dirty);
    }
    setMeta(meta);cloud.snapshotVault=meta.vaultId;cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();
    if(!cloud.dirty||cloud.pending?.revision!==cloud.revision)cloud.pending=null;
    return meta;
  }
  async function push(){
    if(!state.snapshot||state.dataset==='demo'){toast(T('先匯入正式快照，再上傳。','Import a real snapshot before uploading.'));return;}
    if(cloud.revision===null)await pull({force:true});
    const snapshot=normalizeCloudSnapshot(state.snapshot), fingerprint=stableJSON(snapshot);
    if(!cloud.pending||cloud.pending.fingerprint!==fingerprint||cloud.pending.vaultId!==cloud.vaultId||cloud.pending.revision!==cloud.revision){
      cloud.pending={fingerprint,vaultId:cloud.vaultId,revision:cloud.revision,id:cloudRequestId()};
    }
    const meta=readCloudMeta(await request('upload',{requestId:cloud.pending.id,expectedRevision:cloud.revision,snapshot}),cloud.vaultId);
    const remote=normalizeCloudSnapshot(meta.snapshot);
    setDataset(remote,false);setMeta(meta);
    cloud.snapshotVault=meta.vaultId;cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();cloud.pending=null;
    toast(meta.unchanged?T('雲端已是相同資料，沒有重複寫入。','Cloud data already matches; nothing was written twice.'):T('已上傳並核對雲端版本','Uploaded and verified cloud revision')+' '+meta.revision);
  }

      '<div class="dialog-body cloud-dialog"><label>'+T('Apps Script 部署網址','Apps Script deployment URL')+'<input id="psjga-endpoint" type="url" inputmode="url" autocomplete="off" spellcheck="false" value="'+esc(cloud.endpoint)+'" placeholder="https://script.google.com/macros/s/…/exec"></label>'+
      '<label>'+T('PSJGA 存取碼','PSJGA access key','សោចូលប្រើ')+'<input id="psjga-key" type="password" autocomplete="off" spellcheck="false" placeholder="'+(cloud.key?T('已在此分頁驗證；可留白','Verified in this tab; leave blank'):T('從 GS 的指令碼屬性取得','From Apps Script properties'))+'"></label>'+
      (saved?'<p>'+T('已連線。這個瀏覽器已取得裝置授權。','Connected. This browser has a device authorization.')+'</p>':
      '<p>'+T('有已連線的裝置？用它產生一次性配對連結。管理員也可用 PSJGA_ACCESS_KEY 首次連線。','Already connected on another device? Create a one-time pairing link there. Admins can also connect with PSJGA_ACCESS_KEY.')+'</p>'+
      '<div><label style="display:flex;align-items:center;gap:8px"><input id="psjga-remember" type="checkbox" style="width:auto;margin:0"> '+T('記住這台裝置（90 天，適用於私人裝置）','Remember this device for 90 days (private devices only)')+'</label></div>')+
      actions+'<div id="psjga-pair-link"></div>'+
      '<p class="cloud-feedback" id="cloud-dialog-status" aria-live="polite">'+esc(cloud.error||server||T('先驗證連線，再下載總表。','Verify the connection, then download the shared dataset.'))+'</p>'+
      '<div class="cloud-actions">'+button(T('測試 Bot','Test Bot','សាកល្បង Bot'),'cloud-test-bot',null,'small','data-cloud-operation')+
      '<a class="btn small" href="https://github.com/saintdou-weng/PSJGAS/blob/main/INSTALL_CN.md" target="_blank" rel="noopener noreferrer">'+I('external')+T('GS 安裝說明','GS setup guide')+'</a></div></div>'+
      '<div class="dialog-footer">'+button(T('驗證並下載','Connect & download','ភ្ជាប់ និងទាញយក'),'cloud-connect','download','primary','data-cloud-operation')+'</div>');
  }
  async function connectTo(endpoint,key,vault=cloud.snapshotVault){
    const meta=readCloudMeta(await cloudRequest(endpoint,key,'download',{vaultId:vault||undefined}),vault);
    const remote=normalizeCloudSnapshot(meta.snapshot);
    const merged=state.snapshot?mergeSnapshots(remote,state.snapshot):remote;
    const dirty=!sameRows(remote.records,merged.records);
    setDataset(dirty?merged:remote,dirty);
    if(endpoint!==cloud.endpoint||key!==cloud.key)cloud.bot=null;
    cloud.endpoint=endpoint;cloud.key=key;cloud.snapshotVault=meta.vaultId;cloud.pending=null;
    setMeta(meta);cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();
    storage.set('cloud_endpoint',endpoint);
    return meta;
  }
  function saveDevice(endpoint,grant){
    if(!storage.set('cloud_device',{endpoint,...grant}))throw syncError('DEVICE_STORAGE');
  }
  async function connect(){
    const endpoint=normalizeCloudURL(dialog.querySelector('#psjga-endpoint')?.value);
    const key=(dialog.querySelector('#psjga-key')?.value||'').trim()||(endpoint===cloud.endpoint?cloud.key:'');
    const remember=!!dialog.querySelector('#psjga-remember')?.checked;
    const meta=await connectTo(endpoint,key);
    if(remember&&/^[0-9a-f]{64}$/i.test(key)){
      const grant=readDeviceGrant(await request('device_enroll'),meta.vaultId);
      try{saveDevice(endpoint,grant);}catch(e){await cloudRequest(endpoint,grant.token,'device_revoke',{vaultId:grant.vaultId}).catch(()=>{});throw e;}
      cloud.key=grant.token;
    }

  async function handle(a){

    if(a==='cloud-connect'){await run(connect,{refresh:true});return;}
    if(a==='cloud-pair-create'){await run(createPair);return;}
    if(a==='cloud-pair-redeem'){await run(redeemPair,{refresh:true});return;}
    if(a==='cloud-device-forget'){await run(forgetDevice,{refresh:true});return;}

      await run(async()=>{
        const url=pairURL(cloud.endpoint,pairOutgoing);

    if(a==='cloud-preview'){await run(previewSummary);return;}
    if(a==='cloud-send'){await run(sendSummary,{send:true});return;}
    if(a==='cloud-download'||a==='cloud-upload'){
      if(!cloud.checked){settings();return;}
      if(a==='cloud-download')await run(async()=>{
        const meta=await pull();
        toast(meta.unchanged?T('已是最新雲端版本','Cloud version is current'):T('已下載雲端版本','Downloaded cloud revision')+' '+meta.revision);

      else await run(push,{refresh:true});
    }
  }
  async function importSnapshot(file){
    if(!file||cloud.busy)return;
    await run(async()=>{
      if(file.size>4*1024*1024)throw syncError('TOO_LARGE');
      let data;try{data=JSON.parse(await file.text());}catch{throw syncError('BAD_SNAPSHOT');}
      const incoming=normalizeCloudSnapshot(data),base=state.snapshot||emptySnapshot(),merged=mergeSnapshots(base,incoming);
      const changed=!sameRows(base.records,merged.records);
      if(changed){cloud.backedUp=false;cloud.pending=null;}
      setDataset(changed?merged:base,changed||cloud.dirty);
      toast(changed?T('已合併快照；可上傳到雲端。','Snapshot merged. Upload to sync it to the cloud.'):T('沒有較新的紀錄，未重複匯入。','No newer records; nothing was imported twice.'));
    },{refresh:true});
  }
  function exportSnapshot(){
    if(!state.snapshot||state.dataset==='demo'){toast(T('目前沒有正式快照可匯出。','No live snapshot is available to export.'));return;}
    download('PSJGA_snapshot_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state.snapshot,null,2),'application/json');
    cloud.backedUp=true;
  }
  function datasetLabel(){
    if(cloud.dirty)return T('本機快照 · 待上傳','Local snapshot · upload pending','ទិន្នន័យក្នុងម៉ាស៊ីន · រង់ចាំផ្ទុក');
    return T('雲端快照','Cloud snapshot','ទិន្នន័យពពក')+' · v'+cloud.revision;
  }
  window.addEventListener('beforeunload',e=>{if(cloud.dirty&&!cloud.backedUp){e.preventDefault();e.returnValue='';}});
  return {toolbar,handle,importSnapshot,exportSnapshot,datasetLabel,start};
}

const GA_PALETTES=[
  ['white','#f5f7fa','白色','White','ស'],['green','#d3eadb','淡綠','Light green','បៃតងខ្ចី'],['yellow','#f0e4bc','淡黃','Light yellow','លឿងខ្ចី'],['blue','#cfe0f2','淡藍','Light blue','ខៀវខ្ចី'],['pink','#f0d4df','粉紅','Pink','ផ្កាឈូក'],['beige','#e6daca','米色','Beige','ពណ៌ក្រែម'],
  ['navy','#14253b','海軍藍','Navy','ខៀវចាស់'],['forest','#16312b','墨綠','Forest','បៃតងចាស់'],['black','#191b1e','黑色','Black','ខ្មៅ'],['wine','#381920','酒紅','Wine','ក្រហមចាស់'],['purple','#281e3b','紫色','Purple','ស្វាយ']
];
const gaImageTypes=new Set(['image/jpeg','image/png','image/webp']);
function gaBackdropStore(mode,operation){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('PSJGA_appearance',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('local');
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(Error('Storage blocked'));
    req.onsuccess=()=>{
      const db=req.result;
      try{
        const tx=db.transaction('local',mode),request=operation(tx.objectStore('local'));
        tx.oncomplete=()=>{db.close();resolve(request.result);};
        tx.onabort=()=>{db.close();reject(tx.error);};
      }catch(err){db.close();reject(err);}
    };
  });
}
async function gaShrinkBackdrop(file){
  if(!gaImageTypes.has(file.type)||!file.size||file.size>24*1024*1024)throw Error('Invalid image');
  const bitmap=await createImageBitmap(file);
  try{
    const scale=Math.min(1,1920/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Image encoding failed')),'image/jpeg',.84));
  }finally{bitmap.close();}
}
function createAppearanceUI({storage,T,dialog,openDialog,closeButton,toast}){
  const root=document.documentElement;
  const saved=storage.get('appearance',{})||{};
  let colour=GA_PALETTES.some(p=>p[0]===saved.colour)?saved.colour:'white';
  let veil=Number.isFinite(saved.veil)?Math.max(0,Math.min(90,saved.veil)):55;
  let imageURL='',busy=false;
  const remember=()=>storage.set('appearance',{colour,veil});
  function apply(){
    if(!root.style)return;
    const index=GA_PALETTES.findIndex(p=>p[0]===colour);
    root.style.setProperty('--ga-canvas',GA_PALETTES[index][1]);
    root.style.setProperty('--ga-veil',String(veil/100));
    root.toggleAttribute('data-ga-dark',index>=6);
  }
  function showImage(blob){
    const previous=imageURL;
    imageURL=blob?URL.createObjectURL(blob):'';
    if(imageURL)root.style.setProperty('--ga-image',`url("${imageURL}")`);
    else root.style.removeProperty('--ga-image');
    if(previous)URL.revokeObjectURL(previous);
    refresh();
  }
  function refresh(){
    const pane=dialog.querySelector('#ga-appearance');if(!pane)return;
    const remove=pane.querySelector('[data-action="appearance-remove"]');remove.disabled=busy||!imageURL;
    pane.querySelector('[data-action="appearance-pick"]').disabled=busy;
    pane.querySelector('#ga-veil-group').hidden=!imageURL;

  }
  function open(){
    const palette=(rows)=>rows.map(([id,hex,zh,en,km])=>`<button type="button" class="ga-swatch" data-action="appearance-colour" data-colour="${id}" aria-pressed="${id===colour}"><span class="ga-swatch-dot" style="--swatch:${hex}" aria-hidden="true">✓</span><span>${T(zh,en,km)}</span></button>`).join('');
    openDialog(`<div class="dialog-head"><div><small>PSJGA · ${T('個人設定','Preferences','ការកំណត់ផ្ទាល់ខ្លួន')}</small><h2>${T('背景與色彩','Background & colour','ផ្ទៃខាងក្រោយ និងពណ៌')}</h2></div>${closeButton()}</div><div id="ga-appearance" class="dialog-body ga-appearance"><p>${T('這個瀏覽器會記住背景設定。','This browser remembers your background settings.','កម្មវិធីរុករកនេះនឹងចងចាំការកំណត់ផ្ទៃខាងក្រោយ។')}</p><h3>${T('淺色','Light','ពណ៌ស្រាល')}</h3><div class="ga-palette">${palette(GA_PALETTES.slice(0,6))}</div><h3>${T('深色','Dark','ពណ៌ចាស់')}</h3><div class="ga-palette">${palette(GA_PALETTES.slice(6))}</div><div class="ga-image-options"><h3>${T('自訂背景圖','Custom background','រូបផ្ទៃខាងក្រោយផ្ទាល់ខ្លួន')}</h3><p>${T('支援 JPG、PNG、WebP（24 MB 內）。圖片不會上傳。','JPG, PNG or WebP up to 24 MB. Images are never uploaded.','JPG, PNG ឬ WebP រហូតដល់ 24 MB។ រូបភាពមិនត្រូវបានផ្ទុកឡើងទេ។')}</p><div class="actions"><button type="button" class="btn primary" data-action="appearance-pick">${T('匯入圖片','Import image','នាំចូលរូបភាព')}</button><button type="button" class="btn" data-action="appearance-remove">${T('移除背景圖','Remove image','ដករូបភាពចេញ')}</button><input id="ga-image-file" type="file" hidden accept="image/jpeg,image/png,image/webp"></div><div id="ga-veil-group"><label class="ga-range" for="ga-veil"><span>${T('背景遮罩','Image overlay','ស្រទាប់បិទលើរូបភាព')}</span><input id="ga-veil" type="range" min="0" max="90" step="5" value="${veil}"><output id="ga-veil-value" for="ga-veil">${veil}%</output></label></div></div></div>`);
    const file=dialog.querySelector('#ga-image-file'),range=dialog.querySelector('#ga-veil');

    range.addEventListener('input',()=>{veil=Number(range.value);dialog.querySelector('#ga-veil-value').textContent=veil+'%';apply();});
    range.addEventListener('change',()=>{if(!remember())noticeStorage();});
    refresh();
  }
  const noticeStorage=()=>toast(T('此瀏覽器無法記住設定，請檢查儲存空間。','This browser could not save the setting. Check your storage.','កម្មវិធីរុករកមិនអាចរក្សាទុកការកំណត់បានទេ។'));
  async function importImage(file){
    if(busy)return;busy=true;refresh();
    try{
      const blob=await gaShrinkBackdrop(file);
      try{await gaBackdropStore('readwrite',s=>s.put(blob,'image'));}catch{noticeStorage();return;}
      showImage(blob);
      toast(T('背景圖已儲存在這個瀏覽器。','Background saved in this browser.','រូបផ្ទៃខាងក្រោយបានរក្សាទុក។'));
    }catch{toast(T('圖片無法讀取。請選 24 MB 內的 JPG、PNG 或 WebP。','Could not read the image. Choose a JPG, PNG or WebP up to 24 MB.','មិនអាចអានរូបភាពបានទេ។ សូមជ្រើស JPG, PNG ឬ WebP រហូតដល់ 24 MB។'));}
    finally{busy=false;refresh();}
  }
  async function handle(action,el){
    if(action==='appearance'){open();return;}
    if(action==='appearance-colour'){
      if(!GA_PALETTES.some(p=>p[0]===el.dataset.colour))return;
      colour=el.dataset.colour;apply();refresh();if(!remember())noticeStorage();return;

    if(busy)return;

      catch{noticeStorage();}finally{busy=false;refresh();}
    }
  }
  apply();
  if(typeof indexedDB!=='undefined')gaBackdropStore('readonly',s=>s.get('image')).then(blob=>{if(!imageURL&&!busy&&blob instanceof Blob&&gaImageTypes.has(blob.type))showImage(blob);}).catch(()=>{});
  return {handle};

function stats(){const m=metrics(rows()),value=x=>state.dataset==='empty'?'—':n(x);const values=[{label:T('本期工作紀錄','Records this period','កំណត់ត្រាក្នុងរយៈពេល'),v:value(m.total),icon:'clipboard',sub:T('按業務事件去重','Unique business events','កិច្ចការមិនស្ទួន'),action:'records'}, {label:T('待核可','Awaiting approval','រង់ចាំអនុម័ត'),v:value(m.pending),icon:'clock',sub:T('保留原審查與核可流程','Original review & approval flow','រក្សាលំហូរពិនិត្យ និងអនុម័តដើម'),action:'pending'}, {label:T('需關注事項','Needs attention','កិច្ចការត្រូវយកចិត្តទុកដាក់'),v:value(m.abnormal),icon:'alert',sub:T('異常集中追蹤','Issues in one place','តាមដានបញ្ហានៅកន្លែងតែមួយ'),action:'abnormal'}, {label:T('本期已完成','Completed this period','បានបញ្ចប់ក្នុងរយៈពេល'),v:value(m.completed),icon:'check',sub:T('點開核對明細與來源','Open details & source','បើកព័ត៌មានលម្អិត និងប្រភព'),action:'completed'}];return `<div class="stats">${values.map(v=>`<button class="stat" data-action="${v.action}"><div class="stat-head"><span>${v.label}</span>${I(v.icon)}</div><div class="stat-value">${v.v}</div><div class="stat-bottom">${v.sub}</div></button>`).join('')}</div>`;}
function taskLine(r){const m=MODULE_MAP[r.module];return `<button class="task-line" data-record="${esc(recordKey(r))}"><span class="task-icon ${r.status==='abnormal'?'red':r.status==='pending'?'amber':''}">${I(m.icon)}</span><span class="task-main"><strong>${esc(t(r.title))}</strong><small>${esc(t(m.name))} · ${esc(r.owner||'—')} · ${r.date.slice(5)} <span class="source-mini"> / ${SOURCES[r.source].name}</span></small></span>${statusPill(r.status)}${I('chevron')}</button>`;}
function trend(){const filtered=rows(),range=periodRange(state.mode,state.ref),from=new Date(range.from+'T00:00:00Z'),to=new Date(range.to+'T00:00:00Z');let buckets=[];if(state.mode==='year'){buckets=Array.from({length:12},(_,i)=>({label:`${i+1}`,key:range.from.slice(0,4)+'-'+String(i+1).padStart(2,'0')}));}else{const span=Math.round((to-from)/86400000)+1,step=span>14?Math.ceil(span/10):1;for(let i=0;i<span;i+=step){const a=new Date(+from+i*86400000).toISOString().slice(0,10),b=new Date(+from+Math.min(span-1,i+step-1)*86400000).toISOString().slice(0,10);buckets.push({label:a.slice(5),a,b});}}if(buckets.length===1){buckets=[{label:range.from.slice(5),a:range.from,b:range.to}];}for(const b of buckets){const list=filtered.filter(r=>b.key?r.date.startsWith(b.key):r.date>=b.a&&r.date<=b.b);b.total=list.length;b.bad=list.filter(r=>r.status==='abnormal').length;b.good=b.total-b.bad;}const max=Math.max(1,...buckets.map(b=>b.total));return `<section class="panel"><div class="panel-head"><div><h2>${T('工作紀錄趨勢','Activity trend','និន្នាការកំណត់ត្រា')}</h2><div class="panel-sub">${T('跟著所選日／週／月／年變動','Follows the selected day / week / month / year','ប្រែប្រួលតាមថ្ងៃ / សប្ដាហ៍ / ខែ / ឆ្នាំ')}</div></div><div class="chart-head-legend"><span><i class="legend-square"></i>${T('紀錄','Records','កំណត់ត្រា')}</span><span><i class="legend-square" style="background:#e5b297"></i>${T('異常','Issues','បញ្ហា')}</span></div></div>${state.dataset==='empty'?emptyState():`<div class="chart" role="img" aria-label="${esc(buckets.map(b=>`${b.label}: ${b.total}, ${statusText('abnormal')}: ${b.bad}`).join('; '))}">${buckets.map(b=>`<div class="chart-column"><span class="chart-number">${b.total||''}</span><div class="bars"><span class="bar" style="height:${b.good/max*100}%"></span><span class="bar alert" style="height:${b.bad/max*100}%"></span></div><label>${b.label}</label></div>`).join('')}</div><div class="chart-foot">${T('顯示事件筆數；金額、重量與數量分開統計。','Event counts only. Cost, weight and quantity are calculated separately.','បង្ហាញចំនួនកិច្ចការ។ ចំណាយ ទម្ងន់ និងបរិមាណគណនាដាច់ដោយឡែក។')}</div>`}</section>`;}
function coverage(){const list=rows();return `<section class="panel"><div class="panel-head"><div><h2>${T('四大業務，一個入口','Four areas. One workspace.','ផ្នែកបួន នៅកន្លែងតែមួយ')}</h2><div class="panel-sub">SEC · GasCheck · GASExp</div></div><span class="pill teal">23 ${T('模組','modules','មុខងារ')}</span></div><div class="panel-body">${GROUPS.map(g=>{const count=list.filter(r=>MODULE_MAP[r.module].group===g.id).length,mods=MODULES.filter(m=>m.group===g.id).length;return `<button class="area-line" data-route="${g.id}" style="width:100%;background:transparent;border:0;text-align:left;color:inherit"><span class="task-icon" style="color:${g.color};background:${g.color}0d">${I(g.icon)}</span><span><strong>${t(g.name)}</strong><small>${mods} ${T('個原功能入口','original modules','មុខងារដើម')}</small></span><span class="area-number">${state.dataset==='empty'?'—':count}<small>${T('本期紀錄','this period','ក្នុងរយៈពេល')}</small></span></button>`;}).join('')}<div class="coverage-note">${T('入口已按目前程式盤點；原模組的新增、刪改、照片、匯入出及核可仍由原頁處理。','Entrypoints checked against current source. Editing, photos, import/export and approval remain in the original pages.','ច្រកចូលបានផ្ទៀងផ្ទាត់តាមកូដបច្ចុប្បន្ន។ កែប្រែ រូបថត នាំចូល/ចេញ និងអនុម័តនៅទំព័រដើម។')}</div></div></section>`;}
function table(list,full=false){const pages=Math.max(1,Math.ceil(list.length/20));state.page=Math.min(state.page,pages);const view=full?list.slice((state.page-1)*20,state.page*20):list.slice(0,6);if(!view.length)return `<div class="panel">${emptyState()}</div>`;return `<div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th><input type="checkbox" data-action="select-all" aria-label="${T('選取本頁','Select this page','ជ្រើសទំព័រនេះ')}" ${view.every(r=>state.selected.has(recordKey(r)))?'checked':''}></th><th>${T('工作／紀錄','Activity / record','កិច្ចការ / កំណត់ត្រា')}</th><th>${T('業務模組','Module','មុខងារ')}</th><th>${T('日期','Date','កាលបរិច្ឆេទ')}</th><th>${T('負責人','Owner','អ្នកទទួលខុសត្រូវ')}</th><th>${T('狀態','Status','ស្ថានភាព')}</th><th>${T('來源','Source','ប្រភព')}</th></tr></thead><tbody>${view.map(r=>`<tr data-record="${esc(recordKey(r))}" tabindex="0"><td><input type="checkbox" data-select="${esc(recordKey(r))}" ${state.selected.has(recordKey(r))?'checked':''} aria-label="${esc(r.id)}"></td><td class="title-cell">${esc(t(r.title))}<div class="row-code">${esc(r.id)}</div></td><td>${esc(t(MODULE_MAP[r.module].name))}</td><td class="date-cell">${r.date}</td><td>${esc(r.owner||'—')}</td><td>${statusPill(r.status)}</td><td class="source-mini">${SOURCES[r.source].name}${r.sourceRefs.length>1?` · ${r.sourceRefs.length} ${T('關聯','linked','តំណ')}`:''}</td></tr>`).join('')}</tbody></table></div><div class="table-bottom"><span>${state.selected.size?`${state.selected.size} ${T('筆已選','selected','បានជ្រើស')} · `:''}${full?`${(state.page-1)*20+1}–${Math.min(state.page*20,list.length)} / ${list.length}`:`${T('顯示最近','Latest','ចុងក្រោយ')} ${view.length} / ${list.length}`} ${T('筆紀錄','records','កំណត់ត្រា')}</span>${full?`<div class="actions">${button('','page-prev','left','small',`aria-label="Previous page" ${state.page===1?'disabled':''}`)}<span>${state.page} / ${pages}</span>${button('','page-next','chevron','small',`aria-label="Next page" ${state.page===pages?'disabled':''}`)}</div>`:`<button class="text-link" data-route="records">${T('全部紀錄','All records','កំណត់ត្រាទាំងអស់')} ${I('chevron')}</button>`}</div></div>`;}
function filters(){return `<div class="filters"><select class="filter-select" data-filter="group" aria-label="${T('業務類別','Business area','ផ្នែកការងារ')}"><option value="all">${T('全部業務','All areas','គ្រប់ផ្នែក')}</option>${GROUPS.map(g=>`<option value="${g.id}" ${state.group===g.id?'selected':''}>${t(g.name)}</option>`).join('')}</select><select class="filter-select" data-filter="source" aria-label="Source"><option value="all">${T('全部來源','All sources','គ្រប់ប្រភព')}</option>${Object.entries(SOURCES).map(([k,v])=>`<option value="${k}" ${state.source===k?'selected':''}>${v.name}</option>`).join('')}</select><select class="filter-select" data-filter="status" aria-label="${T('狀態','Status','ស្ថានភាព')}"><option value="all">${T('全部狀態','All statuses','គ្រប់ស្ថានភាព')}</option>${STATUSES.map(s=>`<option value="${s}" ${state.status===s?'selected':''}>${statusText(s)}</option>`).join('')}</select><input class="inline-search" data-filter="query" value="${esc(state.query)}" placeholder="${T('搜尋名稱、單號、地點…','Search name, ID, location…','ស្វែងរកឈ្មោះ លេខ ទីតាំង…')}" aria-label="${T('搜尋紀錄','Search records','ស្វែងរកកំណត់ត្រា')}"></div>`;}
function overview(){const list=rows(),tasks=list.filter(r=>['abnormal','pending','in_progress'].includes(r.status)).sort((a,b)=>({abnormal:0,pending:1,in_progress:2}[a.status]-{abnormal:0,pending:1,in_progress:2}[b.status])).slice(0,4);return `${title(T('總務營運總覽','Your operations, at a glance.','ទិដ្ឋភាពប្រតិបត្តិការទូទៅ'),T('先看待辦與異常，再進入每一筆明細。','Start with what needs attention. Follow every item to its source.','មើលកិច្ចការ និងបញ្ហាជាមុន រួចបើកព័ត៌មានលម្អិតនីមួយៗ។'))}${modebar()}${periods()}${stats()}<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>${T('優先處理','Your priorities','អាទិភាពត្រូវដោះស្រាយ')}</h2><div class="panel-sub">${T('待核可、異常與進行中事項集中顯示','Approvals, exceptions and ongoing work in one place','កិច្ចការអនុម័ត បញ្ហា និងការងារកំពុងដំណើរការ')}</div></div><button class="text-link" data-route="tasks">${T('全部待辦','All actions','កិច្ចការទាំងអស់')} ${I('chevron')}</button></div>${tasks.length?tasks.map(taskLine).join(''):emptyState(T('本期沒有待處理事項','Nothing pending in this period','គ្មានកិច្ចការរង់ចាំក្នុងរយៈពេលនេះ'))}</section>${coverage()}</div><div class="grid-two">${trend()}<section class="panel"><div class="panel-head"><div><h2>${T('費用口徑，清楚分開','Clear expense boundaries','បែងចែកចំណាយឱ្យច្បាស់')}</h2><div class="panel-sub">${T('申請額 ≠ 收貨額 ≠ 已入帳費用','Requests ≠ receipts ≠ posted expenses','សំណើ ≠ ទទួលទំនិញ ≠ ចំណាយបានចុះបញ្ជី')}</div></div>${I('wallet')}</div><div class="panel-body">${Object.keys(metrics(list).expenses).length?Object.entries(metrics(list).expenses).map(([c,v])=>`<div class="count-detail"><span>${T('已入帳','Posted','បានចុះបញ្ជី')} · ${c}</span><strong>${money(v,c)}</strong></div>`).join(''):`<div class="stat-value amount">${state.dataset==='empty'?'—':T('無已入帳費用','No posted expenses','គ្មានចំណាយបានចុះបញ្ជី')}</div>`}<div class="coverage-note">${T('只加總標記已入帳的費用；USD 與 KHR 分列，關聯同一事件只計一次。','Only posted expenses count. USD and KHR stay separate; linked copies count once.','គិតតែចំណាយបានចុះបញ្ជី។ USD និង KHR ដាច់គ្នា និងមិនរាប់កិច្ចការភ្ជាប់ស្ទួន។')}</div><button class="text-link" data-route="reports" style="margin-top:14px">${T('查看統計口徑','View reporting rules','មើលវិធីគណនា')} ${I('chevron')}</button></div></section></div><div class="ledger-top"><div><h2>${T('最近工作紀錄','Recent activity','កំណត់ត្រាថ្មីៗ')}</h2><p>${T('點選一筆，開啟明細、證據與原模組','Open a record for details, evidence and the original module','ចុចកំណត់ត្រាដើម្បីមើលព័ត៌មាន ភស្តុតាង និងមុខងារដើម')}</p></div><div class="actions">${button(T('篩選紀錄','Filter records','ត្រងកំណត់ត្រា'),'records','search','small')}</div></div>${table(list)}`;}
function moduleCard(m){return `<article class="module-card"><div class="module-card-head"><span class="task-icon" style="color:${SOURCES[m.source].color};background:${SOURCES[m.source].color}0c">${I(m.icon)}</span><h3>${esc(t(m.name))}</h3><span class="source-mini">${SOURCES[m.source].name}</span></div><p>${esc(t(m.desc))}</p><div class="actions">${button(T('工作台開啟','Open workspace','បើកក្នុងផ្ទាំងការងារ'),'module',null,'',`data-module="${m.id}"`)}${link(T('原頁','Original','ទំព័រដើម'),m.url,'btn','external')}</div></article>`;}
function modulesPage(){const g=GROUPS.find(g=>g.id===state.route),groups=g?[g]:GROUPS;return `${title(g?t(g.name):T('所有功能，清楚歸位。','Every tool. In its place.','មុខងារទាំងអស់ នៅកន្លែងត្រឹមត្រូវ។'),g?t(g.desc):T('依工作找功能，保留三個平台的完整操作入口。','Find tools by task. Keep the complete original workflows.','ស្វែងរកមុខងារតាមការងារ និងរក្សាលំហូរដើមទាំងអស់។'),false)}<div class="scope-note">${I('shield')} ${T('23 個入口已依目前程式核對。點「工作台開啟」載入原模組；點「原頁」可在新分頁完整操作。','23 entrypoints checked against current source. Open a module inside the workspace or in its own tab.','ច្រកចូល 23 បានផ្ទៀងផ្ទាត់តាមកូដបច្ចុប្បន្ន។ បើកមុខងារក្នុងផ្ទាំងការងារ ឬទំព័រដើម។')}</div>${groups.map(g=>`<h2 class="section-title">${I(g.icon)}${t(g.name)} <small>${MODULES.filter(m=>m.group===g.id).length} ${T('個模組','modules','មុខងារ')}</small></h2><div class="module-grid">${MODULES.filter(m=>m.group===g.id).map(moduleCard).join('')}</div>`).join('')}`;}
function tasksPage(){const all=rows().filter(r=>['pending','in_progress','abnormal'].includes(r.status));return `${title(T('把待辦，一件件完成。','Keep work moving.','បញ្ចប់កិច្ចការម្ដងមួយៗ។'),T('跨系統查看狀態，沿用原模組完成審查與處理。','Review across systems. Resolve each item through its original workflow.','មើលស្ថានភាពឆ្លងប្រព័ន្ធ និងដោះស្រាយតាមលំហូរដើម។'))}${modebar()}${periods()}${filters()}<div class="board">${['pending','in_progress','abnormal'].map(status=>{const list=all.filter(r=>r.status===status);return `<section class="board-column"><div class="board-heading">${statusText(status)}<span>${state.dataset==='empty'?'—':list.length}</span></div>${list.length?list.map(r=>`<button class="board-card" data-record="${esc(recordKey(r))}"><span class="source-mini">${SOURCES[r.source].name} / ${esc(t(MODULE_MAP[r.module].name))}</span><strong>${esc(t(r.title))}</strong><span class="small-muted">${esc(r.location||'—')}</span><div class="board-meta"><small>${esc(r.owner||'—')}</small><small>${r.date.slice(5)}</small></div></button>`).join(''):`<p class="small-muted">${T('此分類尚無資料','No items in this column','គ្មានទិន្នន័យក្នុងផ្នែកនេះ')}</p>`}</section>`;}).join('')}</div>`;}
function recordsPage(){return `${title(T('每一筆，都有來源。','Every record. Traceable.','កំណត់ត្រានីមួយៗ មានប្រភព។'),T('集中查詢，日期、狀態與資料來源一眼清楚。','Search by period, status and source without duplicating records.','ស្វែងរកតាមរយៈពេល ស្ថានភាព និងប្រភពដោយមិនស្ទួន។'))}${modebar()}${periods()}${filters()}<p class="scroll-hint">${T('左右滑動查看完整欄位','Swipe horizontally for more columns','អូសឆ្វេងស្ដាំដើម្បីមើលជួរឈរបន្ថែម')}</p>${table(rows(),true)}`;}
function reportsPage(){const list=rows(),m=metrics(list),qt=quantityTotals(list);return `${title(T('看得懂，也對得起來。','Clear numbers. Clear meaning.','តួលេខច្បាស់ យល់ន័យច្បាស់។'),T('筆數、金額與數量分開，每個數字都能下鑽核對。','Counts, currencies and units stay separate. Drill into every figure.','បំបែកចំនួន រូបិយប័ណ្ណ និងឯកតា។ ចុចដើម្បីផ្ទៀងផ្ទាត់តួលេខ។'))}${modebar()}${periods()}${filters()}${stats()}<div class="currency-grid">${['USD','KHR'].map(c=>`<section class="panel report-card"><span class="pill gray">${c} · ${T('已入帳實支','Posted actual expenses','ចំណាយពិតបានចុះបញ្ជី')}</span><div class="stat-value">${state.dataset==='empty'?'—':money(m.expenses[c]||0,c)}</div><div class="method-note">${T('不含待核可採購、收貨庫存價值、ETC 儲值；不同幣別不直接相加。','Excludes pending PO, stock receipt value and ETC top-ups. No mixed-currency total.','មិនរាប់ការទិញរង់ចាំអនុម័ត តម្លៃស្តុកទទួល និងបញ្ចូល ETC។ មិនបូករូបិយប័ណ្ណផ្សេងគ្នា។')}</div></section>`).join('')}</div><div class="grid-two">${trend()}<section class="panel"><div class="panel-head"><h2>${T('按單位分列','Units, kept separate','បែងចែកតាមឯកតា')}</h2>${I('layers')}</div><div class="panel-body">${Object.keys(qt).length?Object.entries(qt).map(([unit,v])=>`<div class="count-detail"><span>${esc(unit)}</span><strong>${n(v)}</strong></div>`).join(''):`<p class="small-muted">${T('本期無可加總數量','No additive quantities in this period','គ្មានបរិមាណសម្រាប់បូកក្នុងរយៈពេលនេះ')}</p>`}<p class="method-note">${T('公斤、公升、桶數各自統計；溫度及相對濕度屬讀數，不做累加。','kg, litres and drums are separate. Temperature and humidity are readings, not additive totals.','គីឡូក្រាម លីត្រ និងធុងគណនាដាច់គ្នា។ មិនបូកសីតុណ្ហភាព ឬសំណើម។')}</p></div></section></div><div class="scope-note">${T('計算方式：來源＋模組＋原始 ID 識別紀錄，保留最新版與刪除標記；明確關聯為同一事件才跨來源去重。','Method: source + module + original ID; latest revision and deletion markers retained. Cross-source deduplication requires an explicit shared event ID.','វិធីគណនា៖ ប្រភព + មុខងារ + ID ដើម រក្សាកំណែថ្មី និងសញ្ញាលុប។ បំបាត់ស្ទួនឆ្លងប្រភពត្រូវមាន ID កិច្ចការរួមច្បាស់លាស់។')}</div>${table(list)}`;}
function sourcesPage(){const live=eventRows(sources());return `${title(T('先確認來源，再相信數字。','Know where your data comes from.','ដឹងប្រភព មុនជឿតួលេខ។'),T('原模組已核對；統一總表接入狀態單獨顯示。','Module entrypoints are verified. Unified-data connection is shown separately.','ច្រកមុខងារបានផ្ទៀងផ្ទាត់។ ស្ថានភាពភ្ជាប់ទិន្នន័យរួមបង្ហាញដាច់ដោយឡែក។'),false)}${modebar()}<div class="source-grid">${Object.entries(SOURCES).map(([key,s])=>`<section class="panel source-card"><span class="pill gray">${T('原功能保留','Original workflows retained','រក្សាមុខងារដើម')}</span><h3 style="color:${s.color};margin-top:18px">${s.name}</h3><p>${esc(s.repo)} · ${MODULES.filter(m=>m.source===key).length} ${T('個入口已盤點','entrypoints checked','ច្រកចូលបានផ្ទៀងផ្ទាត់')}</p><div class="keyline">${T('原模組入口','Module entrypoints','ច្រកមុខងារដើម')} <span class="pill teal">${T('程式已核對','Source checked','បានពិនិត្យកូដ')}</span><br>${T('原資料庫','Original database','មូលដ្ឋានទិន្នន័យដើម')} <span class="pill gray">${T('由原模組同步','Sync in original module','សមកាលកម្មក្នុងមុខងារដើម')}</span><br>${T('總表目前紀錄','Current workspace records','កំណត់ត្រារួមបច្ចុប្បន្ន')} · ${state.dataset==='empty'?'—':live.filter(r=>r.source===key||r.sourceRefs.some(k=>k.startsWith(key+'|'))).length}</div><div class="actions" style="margin-top:20px">${link(T('開啟原平台','Original platform','បើកប្រព័ន្ធដើម'),s.url,'btn small')}</div></section>`).join('')}</div><section class="panel report-block"><div class="panel-head"><div><h2>${T('接入統一資料快照','Load a unified data snapshot','ផ្ទុករូបថតទិន្នន័យរួម')}</h2><div class="panel-sub">${T('合併後可上傳 PSJGA 總表。各原系統仍在原頁同步。','Merge then upload to PSJGA. Original systems sync in their own modules.','បញ្ចូលរួចផ្ទុកទៅ PSJGA។ ប្រព័ន្ធដើមសមកាលកម្មនៅទំព័រដើម។')}</div></div></div><div class="panel-body"><div class="import-box">${I('upload')}<strong>${T('選擇標準 JSON 快照','Choose a standard JSON snapshot','ជ្រើសរូបថតទិន្នន័យ JSON ស្តង់ដារ')}</strong>${T('保留來源、模組、原始 ID、業務日期及更新時間。','Preserves source, module, original ID, business date and revision time.','រក្សាប្រភព មុខងារ ID ដើម កាលបរិច្ឆេទ និងពេលធ្វើបច្ចុប្បន្នភាព។')}<div class="actions" style="justify-content:center;margin-top:18px">${button(T('選取 JSON','Choose JSON','ជ្រើស JSON'),'import','upload','primary')}${button(T('下載格式範例','Download example','ទាញយកគំរូ'),'template','download')}${button(T('匯出總表 JSON','Export full JSON','នាំចេញ JSON'),'cloud-export','download')}</div></div><div class="scope-note">${T('Excel 匯入、新增、修改、刪除、核可與上雲，仍可在各原模組完整操作。此處為新總表的資料介面，不會重建或清除原資料。','Excel import, editing, deletion, approval and cloud sync remain available in each original module. This snapshot interface is for the new unified view.','នាំចូល Excel កែប្រែ លុប អនុម័ត និងសមកាលកម្មពពកនៅមុខងារដើម។ ចំណុចនេះសម្រាប់ទិដ្ឋភាពទិន្នន័យរួមថ្មី។')}</div><p class="method-note">${T('上傳只同步 PSJGA 總表；匯出 JSON 包含版本與刪除標記，可用於備份。','Uploads sync only the PSJGA dataset. Full JSON exports preserve revisions and deletions for backup.','ការផ្ទុកឡើងសមកាលកម្មតែ PSJGA។ ឯកសារ JSON រក្សាកំណែ និងសញ្ញាលុប។')}</p></div></section>`;}
function architecturePage(){const ruleData=[['link',T('一件事，一個主來源','One event, one owner','កិច្ចការមួយ ប្រភពមេមួយ'),T('單號與關聯明確才去重；不以同日期、同金額或同重量直接合併。','Link records explicitly. Never merge solely on equal date, amount or weight.','ភ្ជាប់កំណត់ត្រាច្បាស់។ កុំបញ្ចូលដោយសារកាលបរិច្ឆេទ ចំនួនប្រាក់ ឬទម្ងន់ស្មើគ្នា។')],['shield',T('保留原功能與核可','Retain workflows and approval','រក្សាមុខងារ និងការអនុម័ត'),T('第一階段保留原頁與原 GS；新平台先統一入口與讀取規格。','Phase one keeps original pages and GS. The workspace unifies navigation and the read model.','ដំណាក់កាលទីមួយរក្សាទំព័រ និង GS ដើម។ ផ្ទាំងការងាររួមបញ្ចូលការរុករក និងទម្រង់ទិន្នន័យ។')],['clock',T('日期規則一致','One calendar convention','ក្បួនកាលបរិច្ឆេទតែមួយ'),T('柬埔寨時間；週一至週日、曆月、曆年；按業務日期歸期。','Cambodia time; Monday–Sunday, calendar months and years, using the business date.','ម៉ោងកម្ពុជា សប្ដាហ៍ពីចន្ទដល់អាទិត្យ ខែ/ឆ្នាំប្រតិទិន តាមថ្ងៃប្រតិបត្តិការ។')],['wallet',T('數據分清再加總','Separate before summing','បែងចែកមុនបូក'),T('申請、收貨、實支分開；幣別與單位分列；溫濕度讀數不累加。','Separate PO, receipt and actual spend; keep currencies and units distinct; never sum climate readings.','បំបែកការទិញ ការទទួល និងចំណាយពិត រូបិយប័ណ្ណ និងឯកតា ហើយមិនបូកតម្លៃសីតុណ្ហភាព។')]];return `${title(T('總務全貌，清楚串起。','A clear architecture for General Affairs.','រចនាសម្ព័ន្ធច្បាស់សម្រាប់កិច្ចការទូទៅ។'),T('先統一入口，再依資料契約逐步接入。','Unified navigation first, then verified data adapters.','បញ្ចូលច្រកចូលរួមមុន រួចភ្ជាប់ទិន្នន័យដែលបានផ្ទៀងផ្ទាត់។'),false)}<div class="architecture"><div class="arch-row">${Object.entries(SOURCES).map(([id,s])=>`<article class="arch-card"><h3 style="color:${s.color}">${s.name}</h3><p>${MODULES.filter(m=>m.source===id).length} ${T('個原模組','original modules','មុខងារដើម')} · ${s.repo}<br>${T('原資料、原照片、原核可','Original data, photos and approvals','ទិន្នន័យ រូបថត និងអនុម័តដើម')}</p></article>`).join('')}</div><div class="arch-connector">↓ ${T('讀取轉接・只認主來源','Read adapters · authoritative sources','ភ្ជាប់ការអាន · ប្រភពមេ')} ↓</div><article class="arch-core"><h3>${T('總務統一資料層','Unified General Affairs read model','ស្រទាប់ទិន្នន័យរួមកិច្ចការទូទៅ')}</h3><p>${T('來源＋模組＋原始 ID → 版本核對／刪除標記 → 事件關聯 → 日週月年統計 → 可追溯明細','Source + module + original ID → revisions / tombstones → explicit event links → period metrics → traceable detail','ប្រភព + មុខងារ + ID ដើម → កំណែ / សញ្ញាលុប → តំណកិច្ចការ → ស្ថិតិតាមរយៈពេល → ព័ត៌មានអាចតាមដាន')}</p></article><div class="arch-connector">↓ ${T('同一套搜尋、期間、明細與待辦','Shared search, periods, detail and actions','ការស្វែងរក រយៈពេល ព័ត៌មាន និងកិច្ចការរួម')} ↓</div><div class="module-grid" style="margin:0">${GROUPS.map(g=>`<button class="arch-card" style="text-align:left" data-route="${g.id}"><h3>${I(g.icon)} ${t(g.name)}</h3><p>${t(g.desc)}</p></button>`).join('')}</div><div class="rules">${ruleData.map(([i,h,p])=>`<div class="rule">${I(i)}<div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div><section class="panel"><div class="panel-head"><h2>${T('功能連續性','Workflow continuity','ការបន្តមុខងារ')}</h2><span class="pill teal">23 / 23 ${T('入口已盤點','entrypoints mapped','ច្រកបានរៀបចំ')}</span></div><div class="panel-body"><p class="method-note">${T('原新增／編輯／刪除、照片、Excel 匯入出、上傳下載、歷史與核可入口均可沿原模組進入。此版本沒有改寫三個正式平台或 GS；完整跨系統資料接入及核可整合須再依原欄位驗收。','Original editing, photos, Excel, upload/download, history and approval are accessible through the original modules. This version does not rewrite the three production apps or GS; unified live data and approval require adapter validation.','ការកែប្រែ រូបថត Excel សមកាលកម្ម ប្រវត្តិ និងអនុម័តនៅតែអាចចូលតាមមុខងារដើម។ កំណែនេះមិនកែប្រព័ន្ធពិតទាំងបី ឬ GS ទេ។ ទិន្នន័យពិត និងអនុម័តរួមត្រូវផ្ទៀងផ្ទាត់ការភ្ជាប់បន្ថែម។')}</p></div></section></div>`;}
function workspacePage(){const m=MODULE_MAP[state.workspace];return `${title(esc(t(m.name)),`${SOURCES[m.source].name} · ${esc(t(m.desc))}`,false)}<div class="route-back">${button(T('返回功能列表','Back to modules','ត្រឡប់ទៅបញ្ជីមុខងារ'),'workspace-back','left','small')}</div><section class="module-workspace"><div class="workspace-head"><span>${T('原功能操作區・日期以原模組設定為準','Original workspace · dates follow the module settings','មុខងារដើម · រយៈពេលតាមការកំណត់ក្នុងមុខងារ')}</span><div class="actions">${link(T('另開完整原頁','Open full original page','បើកទំព័រដើមពេញលេញ'),m.url,'btn small')}</div></div><iframe title="${esc(t(m.name))}" src="${esc(m.url)}" referrerpolicy="no-referrer" loading="eager"></iframe><div class="workspace-hint">${T('若原頁限制嵌入或尚在載入，可直接另開原頁。原有資料與核可仍由原系統處理。','If the original page blocks embedding or is still loading, open it in its own tab. Data and approval stay in the original system.','បើទំព័រដើមមិនអនុញ្ញាតបង្កប់ ឬកំពុងផ្ទុក សូមបើកទំព័រដើមដាច់ដោយឡែក។ ទិន្នន័យ និងអនុម័តនៅប្រព័ន្ធដើម។')}</div></section>`;}

hments.length?`<div class="attachments">${r.attachments.map((url,i)=>link(T('查看附件','Open evidence','បើកភស្តុតាង')+' '+(i+1),url)).join('')}</div>`:`<div class="empty-state">${I('camera')}<strong>${T('此筆預覽未附照片','No photos in this preview record','គ្មានរូបថតក្នុងកំណត់ត្រាមើលនេះ')}</strong><p>${T('原模組的照片功能仍保留；正式接入時帶入附件連結。','Original photo workflows remain available. Live adapters will provide attachment references.','មុខងាររូបថតដើមនៅរក្សា។ ការភ្ជាប់ទិន្នន័យពិតនឹងនាំចូលតំណឯកសារ។')}</p></div>`}</div>`;if(drawerTab==='source')body=`<div class="detail-grid">${f(T('原系統','Original system','ប្រព័ន្ធដើម'),SOURCES[r.source].name)}${f(T('原始 ID','Original ID','ID ដើម'),r.id)}${f(T('更新時間','Updated at','ពេលបច្ចុប្បន្នភាព'),r.updatedAt)}${f(T('已入帳實支','Posted actual expense','ចំណាយពិតបានចុះបញ្ជី'),r.posted?T('是','Yes','បាទ/ចាស'):T('否／其他業務階段','No / other workflow stage','ទេ / ដំណាក់កាលការងារផ្សេង'))}</div><div class="source-trace">${esc(r.sourceRefs.join('\n'))}${r.canonicalEventId?'\n\nEvent: '+esc(r.canonicalEventId):''}</div><p class="method-note">${T('相同來源與 ID 取最新版本；跨來源只依明確事件關聯去重。','Latest revision per source ID. Cross-source deduplication uses explicit event links.','យកកំណែថ្មីតាម ID ប្រភព។ បំបាត់ស្ទួនឆ្លងប្រភពដោយតំណកិច្ចការច្បាស់លាស់។')}</p>`;openDialog(base+body+`</div><div class="dialog-footer">${button(T('工作台開啟','Open workspace','បើកក្នុងផ្ទាំងការងារ'),'module',m.icon,'primary',`data-module="${m.id}"`)}${link(T('另開原頁','Open original page','បើកទំព័រដើម'),m.url)}</div>`,true);}
function command(){openDialog(`<div class="dialog-head">${I('search')}<input class="command-input" id="command-input" placeholder="${T('搜尋功能、紀錄或單號…','Search tools, records or IDs…','ស្វែងរកមុខងារ កំណត់ត្រា ឬលេខ…')}" aria-label="Search">${closeButton()}</div><div class="dialog-body command-list" id="command-list"></div>`);updateCommand('');document.querySelector('#command-input').focus();}
function updateCommand(q){q=q.toLowerCase().trim();const mods=MODULES.filter(m=>[...Object.values(m.name),...Object.values(m.desc),m.id,m.source].join(' ').toLowerCase().includes(q));const records=q?eventRows(sources()).filter(r=>[r.id,t(r.title),r.owner].join(' ').toLowerCase().includes(q)).slice(0,8):[];document.querySelector('#command-list').innerHTML=mods.slice(0,12).map(m=>`<button class="command-result" style="width:100%;border:0;background:transparent;text-align:left;color:inherit" data-action="module" data-module="${m.id}">${I(m.icon)}${esc(t(m.name))}<small>${SOURCES[m.source].name}</small>${I('chevron')}</button>`).join('')+records.map(r=>`<button class="command-result" style="width:100%;border:0;background:transparent;text-align:left;color:inherit" data-command-record="${esc(recordKey(r))}">${I('file')}${esc(t(r.title))}<small>${esc(r.id)}</small></button>`).join('')+(!mods.length&&!records.length?`<p class="small-muted">${T('找不到相符項目','No matching results','រកមិនឃើញលទ្ធផលត្រូវគ្នា')}</p>`:'');}
function selectModule(id){if(!MODULE_MAP[id])return;if(state.workspace&&state.workspace!==id&&!confirm(T('請先儲存原模組內容，再切換。確定繼續？','Save changes in the current module before switching. Continue?','សូមរក្សាទុកការកែប្រែមុនប្ដូរ។ បន្ត?')))return;dialog.close();state.workspace=id;state.route='modules';state.menu=false;render();window.scrollTo(0,0);}
const cloudUI=createCloudUI({state,storage,T,t,esc,I,button,dialog,closeButton,openDialog,render,toast,download});
const appearanceUI=createAppearanceUI({storage,T,dialog,openDialog,closeButton,toast});
async function action(a,el){if(a==='appearance'||a.startsWith('appearance-')){await appearanceUI.handle(a,el);return;}if(a==='cloud-export'){cloudUI.exportSnapshot();return;}if(a.startsWith('cloud-')){await cloudUI.handle(a);return;}if(a==='close'){dialog.close();return;}if(a==='module'){selectModule(el.dataset.module);return;}if(a==='menu'||a==='menu-close'){state.menu=a==='menu'?!state.menu:false;render();return;}if(a==='command'){command();return;}if(a==='new'){newDialog();return;}if(a==='sources'||a==='records'){route(a);return;}if(['pending','abnormal','completed'].includes(a)){state.route=a==='pending'?'tasks':'records';state.status=a;state.page=1;render();return;}if(a==='previous'||a==='next'||a==='today'){state.ref=a==='today'?todayICT():shiftPeriod(state.mode,state.ref,a==='previous'?-1:1);state.page=1;state.selected.clear();render();return;}if(a==='demo'||a==='empty'){state.dataset=a==='empty'&&state.snapshot?'snapshot':a;state.page=1;state.selected.clear();storage.set('dataset',state.dataset);render();return;}if(a==='workspace-back'){route('modules');return;}if(a==='page-next'||a==='page-prev'){state.page+=a==='page-next'?1:-1;render();return;}if(a==='detail-prev'||a==='detail-next'){drawerIndex+=a==='detail-prev'?-1:1;drawRecord();return;}if(a==='select-all'){const list=rows(),view=state.route==='overview'?list.slice(0,6):list.slice((state.page-1)*20,state.page*20);view.forEach(r=>el.checked?state.selected.add(recordKey(r)):state.selected.delete(recordKey(r)));render();return;}if(a==='export'){const all=rows(),list=state.selected.size?all.filter(r=>state.selected.has(recordKey(r))):all;if(!list.length){toast(T('此範圍沒有可匯出的紀錄','No records to export in this scope','គ្មានកំណត់ត្រាសម្រាប់នាំចេញក្នុងជម្រើសនេះ'));return;}download(`VRT_GA_${state.dataset}_${state.mode}_${state.ref}.csv`,recordsCSV(list,state.lang),'text/csv;charset=utf-8');toast(T('已匯出所選範圍，含來源與單位。','Exported the selected scope with sources and units.','បាននាំចេញជម្រើសជាមួយប្រភព និងឯកតា។'));return;}if(a==='template'){download('VRT_GA_SAMPLE_snapshot.json',JSON.stringify(demo,null,2),'application/json');return;}if(a==='import'){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',()=>cloudUI.importSnapshot(input.files[0]));input.click();return;}}
document.addEventListener('click',e=>{const sel=e.target.closest('[data-select]');if(sel){sel.checked?state.selected.add(sel.dataset.select):state.selected.delete(sel.dataset.select);e.stopPropagation();render();return;}const lang=e.target.closest('[data-lang]');if(lang){state.lang=lang.dataset.lang;storage.set('lang',state.lang);render();return;}const period=e.target.closest('[data-period]');if(period){state.mode=period.dataset.period;state.page=1;state.selected.clear();render();return;}const tab=e.target.closest('[data-detail-tab]');if(tab){drawerTab=tab.dataset.detailTab;drawRecord();return;}const cmdRecord=e.target.closest('[data-command-record]');if(cmdRecord){const key=cmdRecord.dataset.commandRecord,found=eventRows(sources()).find(r=>recordKey(r)===key);if(found){state.ref=found.date;state.group='all';state.source='all';state.status='all';state.query='';render();recordDialog(key);}return;}const routeEl=e.target.closest('[data-route]');if(routeEl){e.preventDefault();route(routeEl.dataset.route);return;}const actionEl=e.target.closest('[data-action]');if(actionEl){e.preventDefault();action(actionEl.dataset.action,actionEl);return;}const record=e.target.closest('[data-record]');if(record)recordDialog(record.dataset.record);});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='command-input')updateCommand(e.target.value);if(e.target.dataset.filter==='query'){state.query=e.target.value;clearTimeout(searchTimer);const pos=e.target.selectionStart;searchTimer=setTimeout(()=>{state.page=1;state.selected.clear();render();const input=document.querySelector('[data-filter=query]');if(input){input.focus();input.setSelectionRange(pos,pos);}},150);}});
document.addEventListener('change',e=>{const f=e.target.dataset.filter;if(!f)return;const v=e.target.value;if(f==='date'||f==='week'){if(!v)return;try{periodRange('day',v);}catch{return;}state.ref=v;}else if(f==='year'){state.ref=v+'-'+(state.mode==='year'?'01':state.ref.slice(5,7))+'-01';}else if(f==='month'){state.ref=state.ref.slice(0,4)+'-'+v.padStart(2,'0')+'-01';}else state[f]=v;state.page=1;state.selected.clear();render();});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command();}if(e.key==='Escape'&&state.menu){state.menu=false;render();}if(e.key==='Enter'&&e.target.matches('tr[data-record]'))recordDialog(e.target.dataset.record);});
