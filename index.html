  if(!data||!Array.isArray(data.records))throw syncError('BAD_SNAPSHOT');
  // Validate each row before reconciling duplicates; do not silently select a conflicting tie.
  let envelope;
  try{envelope=validateSnapshot({schemaVersion:data.schemaVersion,generatedAt:data.generatedAt,records:[]});envelope.generatedAt=new Date(envelope.generatedAt).toISOString();}catch(e){throw syncError('BAD_SNAPSHOT',e.message);}
  if(data.records.length>5000)throw syncError('TOO_MANY_ROWS');
  const clean=[];
  for(let i=0;i<data.records.length;i++){
    const item=data.records[i];
    if(!item||typeof item!=='object'||Array.isArray(item))throw syncError('BAD_SNAPSHOT',`Row ${i+1}: record object required`);
    if(typeof item.module!=='string'||!Object.hasOwn(MODULE_MAP,item.module)||MODULE_MAP[item.module].source!==item.source)throw syncError('BAD_SNAPSHOT',`Row ${i+1}: module/source mismatch`);
    if(!allowDemo&&typeof item.id==='string'&&item.id.startsWith('DEMO-'))throw syncError('DEMO_REJECTED');
    let r;
    try{r=validateSnapshot({...envelope,records:[item]}).records[0];}catch(e){throw syncError('BAD_SNAPSHOT',`Row ${i+1}: ${e.message.replace(/^Row 1: /,'')}`);}
    if(r.id.includes('|')||r.id!==r.id.trim())throw syncError('BAD_SNAPSHOT',`Row ${i+1}: ID contains a reserved separator or spaces at its ends`);
    // Copy only fields that are part of the unified snapshot contract.
    const row={id:r.id,source:r.source,module:r.module,date:r.date,updatedAt:new Date(r.updatedAt).toISOString(),title:r.title,status:r.status||'completed',owner:r.owner,location:r.location,notes:r.notes,attachments:r.attachments.filter(s=>s.length<=3000),deleted:r.deleted,requiresApproval:r.requiresApproval,posted:r.posted};
    for(const k of ['reviewer','approver','relatedDocumentId','canonicalEventId','unit']){
      if(r[k]==null)continue;
      if(typeof r[k]!=='string'||r[k].trim().length>200)throw syncError('BAD_SNAPSHOT',`Row ${i+1}: invalid ${k}`);
      if(r[k].trim())row[k]=r[k].trim();
    }
    if(r.quantity!=null&&!row.unit)throw syncError('BAD_SNAPSHOT',`Row ${i+1}: quantity needs a unit`);
    if(r.amount!=null){row.amount=r.amount;row.currency=r.currency;}
    if(r.quantity!=null)row.quantity=r.quantity;
    if(r.posted&&r.amount==null&&!r.deleted)throw syncError('BAD_SNAPSHOT',`Row ${i+1}: posted expense needs an amount and currency`);
    clean.push(row);
  }
  return {...envelope,records:mergeRows([],clean).records};
}
function mergeRows(base,incoming){
  const rows=new Map();let keptOlder=0,ignoredOlder=0,duplicates=0;
  for(const r of [...base,...incoming]){
    const key=recordKey(r),old=rows.get(key);
    if(!old){rows.set(key,r);continue;}
    const newer=Date.parse(r.updatedAt)-Date.parse(old.updatedAt);
    if(newer<0||(newer===0&&old.deleted&&!r.deleted)){ignoredOlder++;continue;}
    if(newer===0&&r.deleted===old.deleted){
      if(stableJSON(r)!==stableJSON(old))throw syncError('ROW_CONFLICT',key);
      duplicates++;continue;
    }
    rows.set(key,r);keptOlder++;
  }
  if(rows.size>5000)throw syncError('TOO_MANY_ROWS');
  return {records:[...rows.values()],ignoredOlder,duplicates,replaced:keptOlder};
}
function mergeSnapshots(base,incoming,generatedAt=new Date().toISOString()){
  const a=normalizeCloudSnapshot(base),b=normalizeCloudSnapshot(incoming);
  return {...emptySnapshot(generatedAt),records:mergeRows(a.records,b.records).records};
}
function normalizeCloudURL(input){
  const url=String(input||'').trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,160}\/exec$/.test(url))throw syncError('BAD_URL');
  return url;
}

function ledgerChangedRows(base,current){

function ledgerNextStamp(...rows){
  return new Date(Math.max(Date.now(),...rows.map(row=>row?Date.parse(row.updatedAt)+1:0))).toISOString();
}
function ledgerRebase(remote,drafts,bases){
  const records=ledgerRowMap(remote.records),pending=new Map(),conflicts=new Set();
  for(const row of drafts){
    const key=recordKey(row),server=records.get(key),signature=stableJSON(server);
    if(signature===stableJSON(row))continue;
    const previous=bases.has(key)?bases.get(key):signature;
    if(previous!==signature)conflicts.add(key);
    pending.set(key,previous);records.set(key,row);
  }
  return {snapshot:{...remote,records:[...records.values()]},bases:pending,conflicts};
}

const ledgerCSVFields=[
  ['ID','id'],['Source','source'],['Module','module'],['Business date','date'],['Status','status'],
  ['Title','title'],['Owner','owner'],['Location','location'],['Amount','amount'],['Currency','currency'],
  ['Quantity','quantity'],['Unit','unit'],['Posted','posted'],['Updated at','updatedAt'],

function ledgerCSVTemplate(module){
  const columns=['ID',...(module?[]:['Module']),'Business date','Title','Status','Owner','Location','Notes','Quantity','Unit','Amount','Currency'];
  return '\uFEFF'+columns.map(csvCell).join(',')+'\r\n';
}
function ledgerCSV(rows,language='zh'){
  return '\uFEFF'+[ledgerCSVFields.map(([label])=>label),...rows.map(r=>ledgerCSVFields.map(([,k])=>{
    if(k==='title')return typeof r.title==='string'?r.title:r.title?.[language]||r.title?.en||r.title?.zh||r.id;
    if(k==='titleJSON')return typeof r.title==='object'?JSON.stringify(r.title):'';
    if(k==='attachments')return (r.attachments||[]).join('\n');
    if(typeof r[k]==='boolean')return r[k]?'yes':'no';
    return r[k]??'';
  }))].map(row=>row.map(csvCell).join(',')).join('\r\n');
}
function ledgerParseCSV(input){
  const s=input.replace(/^\uFEFF/,''), rows=[];let row=[],cell='',quoted=false,closed=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(quoted){if(c==='"'&&s[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;closed=true;}else cell+=c;continue;}
    if(c===','||c==='\n'||c==='\r'){
      row.push(cell);cell='';closed=false;
      if(c!==','){if(c==='\r'&&s[i+1]==='\n')i++;if(row.some(Boolean))rows.push(row);row=[];if(rows.length>5001)throw syncError('TOO_MANY_ROWS');}
    }else if(c==='"'&&!cell&&!closed)quoted=true;
    else if(c==='"'||closed)throw syncError('LEDGER_CSV');
    else cell+=c;
  }
  if(quoted)throw syncError('LEDGER_CSV');
  row.push(cell);if(row.some(Boolean))rows.push(row);
  return rows;
}
function ledgerFromCSV(input,{module=null,base=[]}={}){
  const [header,...data]=ledgerParseCSV(input);
  const normalize=s=>s.trim().toLowerCase();
  const names=new Map(ledgerCSVFields.map(([label,k])=>[normalize(label),k]));
  for(const [a,k] of [['單號','id'],['紀錄編號','id'],['模組','module'],['來源','source'],['日期','date'],['業務日期','date'],['名稱','title'],['標題','title'],['負責人','owner'],['地點','location'],['備註','notes']])names.set(a,k);
  const columns=(header||[]).map(h=>names.get(normalize(h)));
  const known=columns.filter(Boolean);
  if(!data.length||!['id','date','title',...(module?[]:['module'])].every(k=>columns.includes(k))||known.length!==new Set(known).size)throw syncError('LEDGER_CSV');
  const prev=ledgerRowMap(base),now=new Date().toISOString();
  const records=data.map(values=>{
    if(values.length!==columns.length)throw syncError('LEDGER_CSV');
    const entries=columns.flatMap((k,i)=>k?[[k,/^'[\s]*[=+@-]/.test(values[i])?values[i].slice(1):values[i]]]:[]);
    const v=Object.fromEntries(entries),moduleId=v.module?.trim()||module||'',m=Object.hasOwn(MODULE_MAP,moduleId)?MODULE_MAP[moduleId]:null;
    if(!m||(module&&module!==m.id)||(v.source?.trim()&&m.source!==v.source.trim()))throw syncError('LEDGER_SCOPE');
    const id=v.id?.trim(),date=v.date?.trim(),title=v.title;if(!id||!date||!title?.trim())throw syncError('LEDGER_CSV');
    const old=prev.get(recordKey({source:m.source,module:m.id,id}));
    const r={...old,id,source:m.source,module:m.id,date,title,status:v.status?.trim()||old?.status||'completed',updatedAt:v.updatedAt?.trim()||old?.updatedAt||now};
    for(const k of ['owner','location','notes','reviewer','approver','relatedDocumentId','canonicalEventId','unit','currency'])if(k in v)r[k]=['owner','location','notes'].includes(k)?v[k]:(v[k].trim()||undefined);
    for(const k of ['amount','quantity'])if(k in v)r[k]=v[k].trim()?Number(v[k]):undefined;
    for(const k of ['posted','requiresApproval','deleted'])if(k in v){
      const b=normalize(v[k]);if(!['','yes','no','true','false','1','0'].includes(b))throw syncError('LEDGER_CSV');
      r[k]=['yes','true','1'].includes(b);
    }
    if('attachments' in v)r.attachments=v.attachments.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(v.titleJSON){try{r.title=JSON.parse(v.titleJSON);}catch{throw syncError('LEDGER_CSV');}}
    const row=normalizeCloudSnapshot({...emptySnapshot(now),records:[r]}).records[0];
    if(old&&!v.updatedAt?.trim()&&stableJSON(row)!==stableJSON(old))row.updatedAt=new Date(Math.max(Date.parse(now),Date.parse(old.updatedAt)+1)).toISOString();
    // An unversioned file must not re-create a row already marked as deleted.
    if(old?.deleted&&!row.deleted&&!v.updatedAt?.trim())return old;
    return row;
  });
  return normalizeCloudSnapshot({...emptySnapshot(now),records});
}

}

const SEC_CACHE={
  'sec.container':{truck:'vrt_truck_v2',insp:'vr-container-inspections',gate:'vrt_v2'},
  'sec.commute':{car:'ac_sec_car_db',bike:'ac_sec_bike_db',gate:'ac_sec_gate_db',late:'ac_sec_late_db'},

const GC_CACHE={'gc.temperature':'vrt_th_r','gc.cleaning':'vrt_clean_hub_v2','gc.ehs':'vrt_waste_v3','gc.dormitory':'vrt_dorm_hub_v2','gc.keymovement':'vrt_keys'};
function originalIDB(dbName,store,keys){
  return new Promise(resolve=>{
    let req;try{req=globalThis.indexedDB?.open(dbName);if(!req){resolve({});return;}}catch{resolve({});return;}
    // No upgrade, database creation, or writes from the reader.
    req.onupgradeneeded=()=>{req.transaction.abort();};
    req.onerror=req.onblocked=()=>resolve({});
    req.onsuccess=()=>{
      const db=req.result,values={};let tx;
      try{tx=db.transaction(store,'readonly');}
      catch{db.close();resolve(values);return;}
      for(const k of keys){const q=tx.objectStore(store).get(k);q.onsuccess=()=>{values[k]=q.result;};}
      tx.oncomplete=tx.onerror=tx.onabort=()=>{db.close();resolve(values);};
    };
  });
}
async function readOriginalCache(id,range){

    const keys=Object.values(def),saved=await originalIDB('ac_sec_data_v1','records',keys);
    const rows=Object.entries(def).flatMap(([kind,k])=>sourceArray(saved[k]??get(k)).map(r=>({...r,_k:kind})));

    const key=EXP_MOBILITY[id],v=await originalIDB('ga-exp-mobility-v1','state',[key]),s=v[key];
    return Array.isArray(s?.rows)&&s.rows.length?[originalPacket(key,s.rows)]:[];

  if(id==='gc.ehs'&&d)return [originalPacket(tool,['gate','internal','monthly'].flatMap(m=>sourceArray(d[m]).map(r=>({...r,module:m}))).concat(sourceArray(d.tombstones).map(r=>({...r,_deleted:true}))))];
  if(Array.isArray(d))return [originalPacket(tool,d,id==='gc.temperature'?{zones:get('vrt_th_z')}:{})];
  if(Array.isArray(d?.records)){
    return [originalPacket(tool,d.records),...(id==='gc.dormitory'?['inspections','violations'].filter(m=>Array.isArray(d[m])).map(m=>originalPacket('dormitory_'+m,d[m])):[])];

function cloudRequestId(){return globalThis.crypto.randomUUID();}
const PSJGA_PAIR_PAGE='https://saintdou-weng.github.io/PSJGAS/';
function readDeviceGrant(result,expectedVault,kind='device'){
  if(!(kind==='device'?/^device_[0-9a-f]{64}$/:/^pair_[0-9a-f]{64}$/).test(result?.token||'')||
     typeof result?.vaultId!=='string'||!/^[-a-zA-Z0-9]{12,80}$/.test(result.vaultId)||
     !(Date.parse(result.expiresAt)>Date.now()))throw syncError('NOT_PSJGA');
  if(expectedVault&&result.vaultId!==expectedVault)throw syncError('VAULT_MISMATCH');
  return {token:result.token,vaultId:result.vaultId,expiresAt:result.expiresAt};
}
function pairURL(endpoint,grant){
  const device=readDeviceGrant(grant,undefined,'pair');
  return PSJGA_PAIR_PAGE+'#'+new URLSearchParams({pair:device.token,exec:normalizeCloudURL(endpoint),vault:device.vaultId});
}
function readPairFragment(fragment){
  const values=new URLSearchParams(fragment.slice(1)),token=values.get('pair')||'',vaultId=values.get('vault')||'';
  if(!/^pair_[0-9a-f]{64}$/.test(token)||!/^[-a-zA-Z0-9]{12,80}$/.test(vaultId))throw syncError('PAIR_EXPIRED');
  return {token,vaultId,endpoint:normalizeCloudURL(values.get('exec'))};
}
function normalizePhonePairCode(input){
  const code=String(input||'').replace(/[\s-]/g,'').toLowerCase();
  if(!/^[0-9a-f]{32}$/.test(code))throw syncError('PHONE_PAIR_CODE');

function formatPhonePairCode(code){return normalizePhonePairCode(code).toUpperCase().match(/.{8}/g).join('-');}
function phonePairHex(bytes){return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');}

async function phonePairCode(secret){
  if(!/^phone_[0-9a-f]{64}$/.test(secret||''))throw syncError('PHONE_PAIR_CODE');
  if(!globalThis.crypto?.subtle)throw syncError('PHONE_PAIR_BROWSER');

  else if(/^device_[0-9a-f]{64}$/.test(key))auth={deviceToken:key};
  else if(action==='pair_redeem'&&/^pair_[0-9a-f]{64}$/.test(key))auth={pairCode:key};
  else if(action==='phone_pair_claim'&&/^phone_[0-9a-f]{64}$/.test(key))auth={phoneSecret:key};

    if(!json||json.service!==SERVICE||json.protocol!==PROTOCOL)throw syncError('NOT_PSJGA');
    if(!json.ok)throw syncError(json.code||'CLOUD_ERROR',json.detail||json.code||'CLOUD_ERROR');

  function status(){

    if(cloud.error)return [T('請查看同步狀態','Check sync status','ពិនិត្យសមកាលកម្ម'),'amber'];

  const request=(action,payload={})=>cloudRequest(cloud.endpoint,cloud.key,action,{vaultId:cloud.vaultId||undefined,...payload});

  function adoptRemote(remote){
    const local=state.snapshot;

  function stageRows(updates,{resolve=new Set()}={}){
    if(!updates.length)return;
    const current=ledgerRowMap(state.snapshot?.records||[]),server=ledgerRowMap(cloud.base?.records||[]);
    for(const row of updates){
      const id=recordKey(row);
      if(cloud.conflicts.has(id)&&!resolve.has(id))throw syncError('LEDGER_CONFLICT');
      current.set(id,row);

    const snap=normalizeCloudSnapshot({...emptySnapshot(),records:[...current.values()]});
    for(const row of updates){
      const id=recordKey(row);
      if(!cloud.bases.has(id)||resolve.has(id))cloud.bases.set(id,stableJSON(server.get(id)));
      if(resolve.has(id))cloud.conflicts.delete(id);

    setDataset(snap,ledgerChangedRows(cloud.base?.records||[],snap.records).length>0);

  async function pull({force=false}={}){
    const knownRevision=!force&&state.snapshot&&cloud.snapshotVault===cloud.vaultId?cloud.revision??undefined:undefined;

    if(meta.unchanged){
      if(!state.snapshot||knownRevision!==meta.revision)throw syncError('NOT_PSJGA');
      state.dataset='snapshot';storage.set('dataset','snapshot');
    }else{
      adoptRemote(normalizeCloudSnapshot(meta.snapshot));

    setMeta(meta);cloud.snapshotVault=meta.vaultId;cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();

  async function push({module=null,group='all',keys=null}={}){

    if(cloud.revision===null)await pull({force:true});
    const rows=changed().filter(row=>scoped(row,module,group)&&(!keys||keys.has(recordKey(row))));
    if(!rows.length){toast(T('這個範圍沒有待上傳的變更。','There are no changes to upload in this scope.'));return;}
    if(rows.some(r=>cloud.conflicts.has(recordKey(r))))throw syncError('LEDGER_CONFLICT');
    const snapshot=normalizeCloudSnapshot({...state.snapshot,records:rows}),fingerprint=stableJSON(snapshot);
    if(!cloud.pending||cloud.pending.fingerprint!==fingerprint||cloud.pending.vaultId!==cloud.vaultId||cloud.pending.revision!==cloud.revision){
      cloud.pending={fingerprint,vaultId:cloud.vaultId,revision:cloud.revision,id:cloudRequestId()};
    }
    const meta=readCloudMeta(await request('upload',{requestId:cloud.pending.id,expectedRevision:cloud.revision,snapshot}),cloud.vaultId);
    adoptRemote(normalizeCloudSnapshot(meta.snapshot));setMeta(meta);
    cloud.snapshotVault=meta.vaultId;cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();cloud.pending=null;
    toast(cloud.conflicts.size?message({code:'LEDGER_CONFLICT'}):meta.unchanged?T('雲端已是相同資料，沒有重複寫入。','Cloud data already matches; nothing was written twice.'):T('已儲存到雲端','Saved to the cloud')+' · '+T('版本','revision')+' '+meta.revision);
  }
  function ensureConnected(){if(!cloud.checked){settings();return false;}return true;}
  async function saveRecords(records,{resolve=new Set(),onStaged}={}){
    if(state.dataset==='demo'){toast(message({code:'DEMO_REJECTED'}));return false;}
    if(!ensureConnected())return false;
    return run(async()=>{
      const clean=normalizeCloudSnapshot({...emptySnapshot(),records}).records;
      stageRows(clean,{resolve});onStaged?.();
      await push({keys:new Set(clean.map(recordKey))});
    },{refresh:true});
  }
  function discardConflict(id){
    if(cloud.busy||!cloud.conflicts.has(id)||!cloud.base)return false;
    const r=ledgerRebase(cloud.base,changed().filter(row=>recordKey(row)!==id),cloud.bases);
    cloud.bases=r.bases;cloud.conflicts=r.conflicts;cloud.pending=null;
    setDataset(r.snapshot,!!r.bases.size);updateToolbar();return true;
  }

  async function connectTo(endpoint,key,vault=cloud.snapshotVault){
    const meta=readCloudMeta(await cloudRequest(endpoint,key,readOnly?'status':'download',{vaultId:vault||undefined}),vault);
    if(!readOnly)adoptRemote(normalizeCloudSnapshot(meta.snapshot));
    if(endpoint!==cloud.endpoint||key!==cloud.key)cloud.bot=null;
    cloud.endpoint=endpoint;cloud.key=key;cloud.snapshotVault=meta.vaultId;cloud.pending=null;
    setMeta(meta);cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();
    storage.set('cloud_endpoint',endpoint);
    return meta;
  }
  function saveDevice(endpoint,grant){
    if(!storage.set('cloud_device',{endpoint,...grant}))throw syncError('DEVICE_STORAGE');
  }
  async function connect(){
    const endpoint=normalizeCloudURL(dialog.querySelector('#psjga-endpoint')?.value);
    const key=(dialog.querySelector('#psjga-key')?.value||'').trim()||(endpoint===cloud.endpoint?cloud.key:'');
    const remember=!!dialog.querySelector('#psjga-remember')?.checked;
    const meta=await connectTo(endpoint,key);
    if(remember&&/^[0-9a-f]{64}$/i.test(key)){
      const grant=readDeviceGrant(await request('device_enroll'),meta.vaultId);
      try{saveDevice(endpoint,grant);}catch(e){await cloudRequest(endpoint,grant.token,'device_revoke',{vaultId:grant.vaultId}).catch(()=>{});throw e;}
      cloud.key=grant.token;
    }
    if(dialog.querySelector('#psjga-key')){dialog.querySelector('#psjga-key').value='';dialog.querySelector('#psjga-key').placeholder=T('已在此分頁驗證；可留白','Verified in this tab; leave blank');}
    if(dialog.open)settings();
    dialogStatus(readOnly?T('裝置已驗證，可查原系統。','Device verified; source records are available.','បានផ្ទៀងផ្ទាត់ឧបករណ៍។'):T('已下載雲端版本','Downloaded cloud revision')+' '+meta.revision+(cloud.dirty?' · '+T('本機更新已保留，待上傳','Local changes retained for upload'):''));
    toast(readOnly?T('裝置已驗證','Device verified','បានផ្ទៀងផ្ទាត់ឧបករណ៍'):T('已連線並下載','Connected and downloaded'));
  }

  async function redeemPair(){
    if(!pairIncoming)throw syncError('PAIR_EXPIRED');
    const {endpoint,token,vaultId}=pairIncoming;
    if((cloud.endpoint&&normalizeCloudURL(cloud.endpoint)!==endpoint)||(cloud.snapshotVault&&cloud.snapshotVault!==vaultId))throw syncError('VAULT_MISMATCH');
    const grant=readDeviceGrant(await cloudRequest(endpoint,token,'pair_redeem',{vaultId}),vaultId);
    pairIncoming=null;
    await finishPair(endpoint,grant);
  }
  async function finishPair(endpoint,grant,{fromPhone=false}={}){
    const {vaultId}=grant;
    try{saveDevice(endpoint,grant);}catch(e){await cloudRequest(endpoint,grant.token,'device_revoke',{vaultId}).catch(()=>{});throw e;}
    if(fromPhone){
      phoneRequest=null;clearTimeout(phoneCheckTimer);storage.set('phone_pair_request',null);
      if(location.hash==='#phone')history.replaceState(null,'',location.pathname+location.search);
    }
    cloud.endpoint=endpoint;cloud.key=grant.token;cloud.vaultId=vaultId;
    if(dialog.open&&(!fromPhone||dialog.querySelector('#psjga-phone-code')))dialog.close();
    await connectTo(endpoint,grant.token,vaultId);
    toast(T('配對完成，已記住這台裝置','Paired and remembered this device'));
  }

  function claimPhone(){
    if(phoneClaim)return phoneClaim;
    phoneClaim=(async()=>{
      if(!phoneRequest||phoneRequest.until<=Date.now())throw syncError('PHONE_PAIR_STALE');
      const {endpoint,secret}=phoneRequest;
      if(endpoint!==normalizeCloudURL(cloud.endpoint))throw syncError('VAULT_MISMATCH');
      const grant=readDeviceGrant(await cloudRequest(endpoint,secret,'phone_pair_claim',{vaultId:cloud.snapshotVault||undefined}),cloud.snapshotVault);
      await finishPair(endpoint,grant,{fromPhone:true});
    })().finally(()=>{phoneClaim=null;});
    return phoneClaim;
  }
  function visiblePhoneRequest(){

  function schedulePhoneCheck(){

  async function checkPhoneAutomatically(){
    clearTimeout(phoneCheckTimer);
    if(!visiblePhoneRequest())return;
    if(cloud.busy||phoneClaim){schedulePhoneCheck();return;}
    try{
      await claimPhone();
      cloud.error='';
      if(!state.workspace)render();
      updateToolbar();
    }catch(e){
      if(!['PHONE_PAIR_WAIT','BUSY','NETWORK','TIMEOUT','HTTP_ERROR'].includes(e?.code)||!phoneRequest){
        if(visiblePhoneRequest())dialogStatus(message(e),true);
        else if(!phoneRequest){cloud.error=message(e);updateToolbar();toast(cloud.error);}
        return;
      }
      phoneCheckDelay=Math.min(phoneCheckDelay+6000,30000);
      schedulePhoneCheck();
    }
  }

  async function submitPassword(){
    const text=(dialog.querySelector('#psjga-open-pass')?.value||'').trim();
    if(!text){dialogStatus(T('請輸入密碼。','Enter the password.','សូមបញ្ចូលពាក្យសម្ងាត់។'),true);return;}
    const digest=await globalThis.crypto.subtle.digest('SHA-256',new TextEncoder().encode('psjga-open|'+text));
    const pass='device_'+[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
    const endpoint=normalizeCloudURL(cloud.endpoint);
    try{await connectTo(endpoint,pass,undefined);}
    catch(e){
      if(e?.code==='DEVICE_EXPIRED'||e?.code==='AUTH'){const wrong=T('密碼不對，請再輸入一次。','Wrong password. Try again.','ពាក្យសម្ងាត់មិនត្រឹមត្រូវ។');dialogStatus(wrong,true);toast(wrong);return;}
      throw e;
    }
    storage.set('cloud_open',pass);
    dialog.close();toast(T('已連線，這台裝置之後不用再輸入。','Connected. This device will not ask again.','បានភ្ជាប់។'));
  }
  async function forgetDevice(){
    if(!cloud.key.startsWith('device_'))return;
    if(cloud.key===storage.get('cloud_open','')){
      storage.set('cloud_open','');cloud.key='';cloud.checked=false;cloud.bot=null;cloud.lastSync=null;
      dialog.close();render();passwordDialog();return;
    }
    await request('device_revoke');
    storage.set('cloud_device',null);cloud.key='';cloud.checked=false;cloud.bot=null;cloud.lastSync=null;pairOutgoing=null;
    if(!cloud.dirty){state.snapshot=null;state.dataset='empty';cloud.base=null;cloud.snapshotVault='';cloud.bases.clear();cloud.conflicts.clear();state.selected.clear();storage.set('dataset','empty');}
    if(dialog.open)settings();
    toast(T('已登出這台裝置','This device has been signed out'));
  }
  async function start(fragment){
    if(fragment.startsWith('#pair=')){
      // Remove the short-lived credential from the address before displaying the prompt.
      history.replaceState(null,'',location.pathname+location.search);
      try{pairIncoming=readPairFragment(fragment);pairingDialog();}
      catch(e){settings();dialogStatus(message(e),true);}
      return;
    }
    const phone=fragment==='#phone';
    if(cloud.checked){if(phone)settings();return;}
    const showPhone=()=>run(async()=>{try{await phoneDialog();}catch(e){settings();throw e;}});
    // v1.4.3: one password per device (no pairing). The page stores only a hash-derived pass, never the password.
    const direct=async()=>{
      if(!cloud.endpoint)return false;
      let endpoint;try{endpoint=normalizeCloudURL(cloud.endpoint);}catch{return false;}
      const pass=storage.get('cloud_open','');
      if(/^device_[0-9a-f]{64}$/.test(pass||'')){
        let code='';
        await run(async()=>{try{await connectTo(endpoint,pass,undefined);}catch(e){code=e?.code||'ERR';throw e;}},{refresh:true});
        if(cloud.checked)return true;
        if(code!=='DEVICE_EXPIRED'&&code!=='AUTH')return true; // network trouble: keep the saved pass
        storage.set('cloud_open','');
      }
      cloud.error='';passwordDialog();return true;
    };
    const saved=storage.get('cloud_device',null);
    if(!saved){if(await direct()){if(phone)settings();return;}if(phone)await showPhone();return;}
    let grant,endpoint;
    try{grant=readDeviceGrant(saved);endpoint=normalizeCloudURL(saved.endpoint);}
    catch{storage.set('cloud_device',null);if(await direct()){if(phone)settings();return;}cloud.error=message({code:'DEVICE_EXPIRED'});updateToolbar();if(phone)await showPhone();return;}
    cloud.endpoint=endpoint;cloud.key=grant.token;
    await run(()=>connectTo(endpoint,grant.token,grant.vaultId),{refresh:true});
    if(!cloud.checked&&await direct()){if(phone)settings();return;}
    if(phone){if(cloud.checked)settings();else await showPhone();}
  }

    if(a==='cloud-phone-renew'){await run(()=>phoneDialog({renew:true}));return;}

    if(a==='cloud-pair-copy'){
      await run(async()=>{
        const url=pairURL(cloud.endpoint,pairOutgoing);
        try{await navigator.clipboard.writeText(url);dialogStatus(T('已複製配對連結。','Pairing link copied.'));}
        catch{const input=dialog.querySelector('#psjga-pair-url');if(input){input.type='text';input.select();}dialogStatus(T('請複製上方連結。','Copy the link above.'));}

    if(a==='cloud-preview'){await run(previewSummary);return;}

      },{refresh:true});

    }
  }
  async function importSnapshot(file,{module=null,group='all'}={}){

      const updates=ledgerChangedRows(base.records,mergeSnapshots(base,incoming).records);
      stageRows(updates);
      toast(updates.length?T('已合併 ','Merged ')+updates.length+T(' 筆，待上傳。',' changes. Upload to save them to the cloud.'):T('沒有較新的紀錄，未重複匯入。','No newer records; nothing was imported twice.'));

  }

  }

const GA_PALETTES=[
  ['white','#f5f7fa','白色','White','ស'],['green','#d3eadb','淡綠','Light green','បៃតងខ្ចី'],['yellow','#f0e4bc','淡黃','Light yellow','លឿងខ្ចី'],['blue','#cfe0f2','淡藍','Light blue','ខៀវខ្ចី'],['pink','#f0d4df','粉紅','Pink','ផ្កាឈូក'],['beige','#e6daca','米色','Beige','ពណ៌ក្រែម'],
  ['navy','#14253b','海軍藍','Navy','ខៀវចាស់'],['forest','#16312b','墨綠','Forest','បៃតងចាស់'],['black','#191b1e','黑色','Black','ខ្មៅ'],['wine','#381920','酒紅','Wine','ក្រហមចាស់'],['purple','#281e3b','紫色','Purple','ស្វាយ']
];
const gaImageTypes=new Set(['image/jpeg','image/png','image/webp']);
function gaBackdropStore(mode,operation){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('PSJGA_appearance',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('local');
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(Error('Storage blocked'));
    req.onsuccess=()=>{
      const db=req.result;
      try{
        const tx=db.transaction('local',mode),request=operation(tx.objectStore('local'));
        tx.oncomplete=()=>{db.close();resolve(request.result);};
        tx.onabort=()=>{db.close();reject(tx.error);};
      }catch(err){db.close();reject(err);}
    };
  });
}
async function gaShrinkBackdrop(file){
  if(!gaImageTypes.has(file.type)||!file.size||file.size>24*1024*1024)throw Error('Invalid image');
  const bitmap=await createImageBitmap(file);
  try{
    const scale=Math.min(1,1920/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Image encoding failed')),'image/jpeg',.84));
  }finally{bitmap.close();}
}
function createAppearanceUI({storage,T,dialog,openDialog,closeButton,toast}){

    range.addEventListener('change',()=>{if(!remember())noticeStorage();});

  }

  async function importImage(file){

function stats(){const m=metrics(rows()),value=x=>!sourceCoverage().any?'—':n(x);const values=[{label:T('本期工作紀錄','Records this period','កំណត់ត្រាក្នុងរយៈពេល'),v:value(m.total),icon:'clipboard',sub:T('按業務事件去重','Unique business events','កិច្ចការមិនស្ទួន'),action:'records'}, {label:T('待核可','Awaiting approval','រង់ចាំអនុម័ត'),v:value(m.pending),icon:'clock',sub:T('保留原審查與核可流程','Original review & approval flow','រក្សាលំហូរពិនិត្យ និងអនុម័តដើម'),action:'pending'}, {label:T('需關注事項','Needs attention','កិច្ចការត្រូវយកចិត្តទុកដាក់'),v:value(m.abnormal),icon:'alert',sub:T('異常集中追蹤','Issues in one place','តាមដានបញ្ហានៅកន្លែងតែមួយ'),action:'abnormal'}, {label:T('本期已完成','Completed this period','បានបញ្ចប់ក្នុងរយៈពេល'),v:value(m.completed),icon:'check',sub:T('點開核對明細與來源','Open details & source','បើកព័ត៌មានលម្អិត និងប្រភព'),action:'completed'}];return `<div class="stats">${values.map(v=>`<button class="stat" data-action="${v.action}"><div class="stat-head"><span>${v.label}</span>${I(v.icon)}</div><div class="stat-value">${v.v}</div><div class="stat-bottom">${v.sub}</div></button>`).join('')}</div>`;}

function trend(){const filtered=rows(),range=periodRange(state.mode,state.ref),from=new Date(range.from+'T00:00:00Z'),to=new Date(range.to+'T00:00:00Z');let buckets=[];if(state.mode==='year'){buckets=Array.from({length:12},(_,i)=>({label:`${i+1}`,key:range.from.slice(0,4)+'-'+String(i+1).padStart(2,'0')}));}else{const span=Math.round((to-from)/86400000)+1,step=span>14?Math.ceil(span/10):1;for(let i=0;i<span;i+=step){const a=new Date(+from+i*86400000).toISOString().slice(0,10),b=new Date(+from+Math.min(span-1,i+step-1)*86400000).toISOString().slice(0,10);buckets.push({label:a.slice(5),a,b});}}if(buckets.length===1){buckets=[{label:range.from.slice(5),a:range.from,b:range.to}];}for(const b of buckets){const list=filtered.filter(r=>b.key?r.date.startsWith(b.key):r.date>=b.a&&r.date<=b.b);b.total=list.length;b.bad=list.filter(r=>r.status==='abnormal').length;b.good=b.total-b.bad;}const max=Math.max(1,...buckets.map(b=>b.total));return `<section class="panel"><div class="panel-head"><div><h2>${T('工作紀錄趨勢','Activity trend','និន្នាការកំណត់ត្រា')}</h2><div class="panel-sub">${T('跟著所選日／週／月／年變動','Follows the selected day / week / month / year','ប្រែប្រួលតាមថ្ងៃ / សប្ដាហ៍ / ខែ / ឆ្នាំ')}</div></div><div class="chart-head-legend"><span><i class="legend-square"></i>${T('紀錄','Records','កំណត់ត្រា')}</span><span><i class="legend-square" style="background:#e5b297"></i>${T('異常','Issues','បញ្ហា')}</span></div></div>${!sourceCoverage().any?emptyState():`<div class="chart" role="img" aria-label="${esc(buckets.map(b=>`${b.label}: ${b.total}, ${statusText('abnormal')}: ${b.bad}`).join('; '))}">${buckets.map(b=>`<div class="chart-column"><span class="chart-number">${b.total||''}</span><div class="bars"><span class="bar" style="height:${b.good/max*100}%"></span><span class="bar alert" style="height:${b.bad/max*100}%"></span></div><label>${b.label}</label></div>`).join('')}</div><div class="chart-foot">${T('顯示事件筆數；金額、重量與數量分開統計。','Event counts only. Cost, weight and quantity are calculated separately.','បង្ហាញចំនួនកិច្ចការ។ ចំណាយ ទម្ងន់ និងបរិមាណគណនាដាច់ដោយឡែក។')}</div>`}</section>`;}

if(start){state.route=start.name;state.workspace=start.workspace;state.module=start.mod;state.kind=start.mod==='sec.container'&&!start.workspace?'truck':'all';state.group=GROUPS.some(g=>g.id===start.name)?start.name:'all';}
render();void cloudUI.start(location.hash);
function followLocation(){
  const h=location.hash.slice(1);
  if(h.startsWith('pair=')||h==='phone'){void cloudUI.start(location.hash);return;}
  if((h||'overview')!==currentPath())route(h||'overview',{write:false});
}
window.addEventListener('hashchange',followLocation);
window.addEventListener('popstate',followLocation);
