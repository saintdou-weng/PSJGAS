  function setDataset(snap,dirty){
    if(!state.snapshot||!sameRows(state.snapshot.records,snap.records)){
      state.page=1;state.selected.clear();
    }
    state.snapshot=snap;state.dataset='snapshot';cloud.dirty=dirty;
    if(!dirty)cloud.backedUp=true;
    storage.set('dataset','snapshot');
  }
  function setMeta(meta){
    cloud.checked=true;cloud.vaultId=meta.vaultId;cloud.remoteRevision=meta.revision;
    cloud.updatedAt=meta.updatedAt;cloud.telegramConfigured=meta.telegramConfigured;
  }
  async function run(fn,{refresh=false,send=false}={}){
    if(cloud.busy)return false;
    cloud.error='';setBusy(true);
    try{
      await fn();
      if(refresh&&!state.workspace)render();
      return true;
    }catch(e){
      if(e?.code==='DEVICE_EXPIRED'&&cloud.key.startsWith('device_')){
        storage.set('cloud_device',null);cloud.key='';cloud.checked=false;cloud.bot=null;pairOutgoing=null;
      }
      cloud.error=send&&e?.code==='TIMEOUT'?T('未收到發送確認。請先到群組查核。','Send confirmation timed out. Check the group first.'):message(e);
      dialogStatus(cloud.error,true);toast(cloud.error);
      if(refresh&&!state.workspace)render();
      return false;
    }finally{setBusy(false);}
  }
  const request=(action,payload={})=>cloudRequest(cloud.endpoint,cloud.key,action,{vaultId:cloud.vaultId||undefined,...payload});
  const changed=()=>ledgerChangedRows(cloud.base?.records||[],state.snapshot?.records||[]);
  function adoptRemote(remote){
    const local=state.snapshot;
    const drafts=cloud.base?changed():local?ledgerChangedRows(remote.records,mergeSnapshots(remote,local).records):[];
    const {snapshot,bases,conflicts}=ledgerRebase(remote,drafts,cloud.bases);
    cloud.base=remote;cloud.bases=bases;cloud.conflicts=conflicts;
    setDataset(bases.size?{...snapshot,generatedAt:local?.generatedAt||remote.generatedAt}:remote,!!bases.size);
  }
  function stageRows(updates,{resolve=new Set()}={}){
    if(!updates.length)return;
    const current=ledgerRowMap(state.snapshot?.records||[]),server=ledgerRowMap(cloud.base?.records||[]);
    for(const row of updates){
      const id=recordKey(row);
      if(cloud.conflicts.has(id)&&!resolve.has(id))throw syncError('LEDGER_CONFLICT');
      current.set(id,row);
    }
    const snap=normalizeCloudSnapshot({...emptySnapshot(),records:[...current.values()]});
    for(const row of updates){
      const id=recordKey(row);
      if(!cloud.bases.has(id)||resolve.has(id))cloud.bases.set(id,stableJSON(server.get(id)));
      if(resolve.has(id))cloud.conflicts.delete(id);
    }
    cloud.backedUp=false;cloud.pending=null;
    setDataset(snap,ledgerChangedRows(cloud.base?.records||[],snap.records).length>0);
  }
  async function pull({force=false}={}){
    const knownRevision=!force&&state.snapshot&&cloud.snapshotVault===cloud.vaultId?cloud.revision??undefined:undefined;
    const meta=readCloudMeta(await request('download',{knownRevision}),cloud.snapshotVault||cloud.vaultId);
    if(meta.unchanged){
      if(!state.snapshot||knownRevision!==meta.revision)throw syncError('NOT_PSJGA');
      state.dataset='snapshot';storage.set('dataset','snapshot');
    }else{
      adoptRemote(normalizeCloudSnapshot(meta.snapshot));
    }
    setMeta(meta);cloud.snapshotVault=meta.vaultId;cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();
    if(!cloud.dirty||cloud.pending?.revision!==cloud.revision)cloud.pending=null;
    return meta;
  }
  async function push({module=null,group='all',keys=null}={}){
    if(!state.snapshot||state.dataset==='demo'){toast(T('先匯入正式快照，再上傳。','Import a real snapshot before uploading.'));return;}
    if(cloud.revision===null)await pull({force:true});
    const rows=changed().filter(row=>scoped(row,module,group)&&(!keys||keys.has(recordKey(row))));
    if(!rows.length){toast(T('這個範圍沒有待上傳的變更。','There are no changes to upload in this scope.'));return;}
    if(rows.some(r=>cloud.conflicts.has(recordKey(r))))throw syncError('LEDGER_CONFLICT');
    const snapshot=normalizeCloudSnapshot({...state.snapshot,records:rows}),fingerprint=stableJSON(snapshot);
    if(!cloud.pending||cloud.pending.fingerprint!==fingerprint||cloud.pending.vaultId!==cloud.vaultId||cloud.pending.revision!==cloud.revision){
      cloud.pending={fingerprint,vaultId:cloud.vaultId,revision:cloud.revision,id:cloudRequestId()};
    }
    const meta=readCloudMeta(await request('upload',{requestId:cloud.pending.id,expectedRevision:cloud.revision,snapshot}),cloud.vaultId);
    adoptRemote(normalizeCloudSnapshot(meta.snapshot));setMeta(meta);
    cloud.snapshotVault=meta.vaultId;cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();cloud.pending=null;
    toast(cloud.conflicts.size?message({code:'LEDGER_CONFLICT'}):meta.unchanged?T('雲端已是相同資料，沒有重複寫入。','Cloud data already matches; nothing was written twice.'):T('已儲存到雲端','Saved to the cloud')+' · '+T('版本','revision')+' '+meta.revision);
  }
  function ensureConnected(){if(!cloud.checked){settings();return false;}return true;}
  async function saveRecords(records,{resolve=new Set(),onStaged}={}){
    if(state.dataset==='demo'){toast(message({code:'DEMO_REJECTED'}));return false;}
    if(!ensureConnected())return false;
    return run(async()=>{
      const clean=normalizeCloudSnapshot({...emptySnapshot(),records}).records;
      stageRows(clean,{resolve});onStaged?.();
      await push({keys:new Set(clean.map(recordKey))});
    },{refresh:true});
  }
  function discardConflict(id){
    if(cloud.busy||!cloud.conflicts.has(id)||!cloud.base)return false;
    const r=ledgerRebase(cloud.base,changed().filter(row=>recordKey(row)!==id),cloud.bases);
    cloud.bases=r.bases;cloud.conflicts=r.conflicts;cloud.pending=null;
    setDataset(r.snapshot,!!r.bases.size);updateToolbar();return true;
  }

  async function connectTo(endpoint,key,vault=cloud.snapshotVault){
    const meta=readCloudMeta(await cloudRequest(endpoint,key,'download',{vaultId:vault||undefined}),vault);
    adoptRemote(normalizeCloudSnapshot(meta.snapshot));
    if(endpoint!==cloud.endpoint||key!==cloud.key)cloud.bot=null;
    cloud.endpoint=endpoint;cloud.key=key;cloud.snapshotVault=meta.vaultId;cloud.pending=null;
    setMeta(meta);cloud.revision=meta.revision;cloud.lastSync=new Date().toISOString();
    storage.set('cloud_endpoint',endpoint);
    return meta;
  }
  function saveDevice(endpoint,grant){
    if(!storage.set('cloud_device',{endpoint,...grant}))throw syncError('DEVICE_STORAGE');
  }
  async function connect(){
    const endpoint=normalizeCloudURL(dialog.querySelector('#psjga-endpoint')?.value);
    const key=(dialog.querySelector('#psjga-key')?.value||'').trim()||(endpoint===cloud.endpoint?cloud.key:'');
    const remember=!!dialog.querySelector('#psjga-remember')?.checked;
    const meta=await connectTo(endpoint,key);
    if(remember&&/^[0-9a-f]{64}$/i.test(key)){
      const grant=readDeviceGrant(await request('device_enroll'),meta.vaultId);
      try{saveDevice(endpoint,grant);}catch(e){await cloudRequest(endpoint,grant.token,'device_revoke',{vaultId:grant.vaultId}).catch(()=>{});throw e;}
      cloud.key=grant.token;
    }
    if(dialog.querySelector('#psjga-key')){dialog.querySelector('#psjga-key').value='';dialog.querySelector('#psjga-key').placeholder=T('已在此分頁驗證；可留白','Verified in this tab; leave blank');}
    if(dialog.open)settings();
    dialogStatus(T('已下載雲端版本','Downloaded cloud revision')+' '+meta.revision+(cloud.dirty?' · '+T('本機更新已保留，待上傳','Local changes retained for upload'):''));
    toast(T('已連線並下載','Connected and downloaded'));
  }

  async function redeemPair(){
    if(!pairIncoming)throw syncError('PAIR_EXPIRED');
    const {endpoint,token,vaultId}=pairIncoming;
    if((cloud.endpoint&&normalizeCloudURL(cloud.endpoint)!==endpoint)||(cloud.snapshotVault&&cloud.snapshotVault!==vaultId))throw syncError('VAULT_MISMATCH');
    const grant=readDeviceGrant(await cloudRequest(endpoint,token,'pair_redeem',{vaultId}),vaultId);
    pairIncoming=null;
    await finishPair(endpoint,grant);

const gaImageTypes=new Set(['image/jpeg','image/png','image/webp']);
function gaBackdropStore(mode,operation){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('PSJGA_appearance',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('local');
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(Error('Storage blocked'));
    req.onsuccess=()=>{
      const db=req.result;
      try{
        const tx=db.transaction('local',mode),request=operation(tx.objectStore('local'));
        tx.oncomplete=()=>{db.close();resolve(request.result);};
        tx.onabort=()=>{db.close();reject(tx.error);};
      }catch(err){db.close();reject(err);}
    };
  });
}
async function gaShrinkBackdrop(file){
  if(!gaImageTypes.has(file.type)||!file.size||file.size>24*1024*1024)throw Error('Invalid image');
  const bitmap=await createImageBitmap(file);
  try{
    const scale=Math.min(1,1920/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Image encoding failed')),'image/jpeg',.84));
  }finally{bitmap.close();}
}

    const file=dialog.querySelector('#ga-image-file'),range=dialog.querySelector('#ga-veil');

  async function importImage(file){
    if(busy)return;busy=true;refresh();
    try{
      const blob=await gaShrinkBackdrop(file);
      try{await gaBackdropStore('readwrite',s=>s.put(blob,'image'));}catch{noticeStorage();return;}
      showImage(blob);
      toast(T('背景圖已儲存在這個瀏覽器。','Background saved in this browser.','រូបផ្ទៃខាងក្រោយបានរក្សាទុក។'));

    finally{busy=false;refresh();}
  }
  async function handle(action,el){
    if(action==='appearance'){open();return;}
    if(action==='appearance-colour'){
      if(!GA_PALETTES.some(p=>p[0]===el.dataset.colour))return;
      colour=el.dataset.colour;apply();refresh();if(!remember())noticeStorage();return;
    }
    if(busy)return;
    if(action==='appearance-pick'){dialog.querySelector('#ga-image-file')?.click();return;}
    if(action==='appearance-remove'&&imageURL){
      busy=true;refresh();
      try{await gaBackdropStore('readwrite',s=>s.delete('image'));showImage(null);}
      catch{noticeStorage();}finally{busy=false;refresh();}
    }
  }
  apply();
  if(typeof indexedDB!=='undefined')gaBackdropStore('readonly',s=>s.get('image')).then(blob=>{if(!imageURL&&!busy&&blob instanceof Blob&&gaImageTypes.has(blob.type))showImage(blob);}).catch(()=>{});
  return {handle};
}

function modebar(){const demoMode=state.dataset==='demo',snap=state.dataset==='snapshot';const label=demoMode?T('範例資料・非正式營運數據','Sample data · not live operational data','ទិន្នន័យគំរូ · មិនមែនទិន្នន័យប្រតិបត្តិការពិត'):snap?cloudUI.datasetLabel():T('尚未載入總表・可直接開啟原模組','Shared dataset not loaded · original modules available','មិនទាន់ផ្ទុកទិន្នន័យរួម · អាចបើកមុខងារដើម');return `<div class="modebar ${state.dataset==='empty'?'empty':''}">${I('info')}<span><strong>${label}</strong>${snap?` · ${new Date(state.snapshot.generatedAt).toLocaleString('en-GB',{timeZone:'Asia/Phnom_Penh',hour12:false})} ICT`:''}</span><div class="actions">${button(demoMode?T('返回正式總表','Return to shared dataset','ត្រឡប់ទៅទិន្នន័យរួម'):T('查看範例','View sample','មើលគំរូ'),demoMode?'empty':'demo',null,'quiet')}${button(T('資料來源','Sources','ប្រភព'),'sources',null,'quiet')}</div></div>`;}
function periods(){const r=periodRange(state.mode,state.ref),y=+state.ref.slice(0,4),mo=+state.ref.slice(5,7),years=Array.from({length:Math.max(15,y-2017+2)},(_,i)=>2018+i);let picker='';if(state.mode==='day')picker=`<input class="filter-select" type="date" data-filter="date" value="${state.ref}" aria-label="${T('日期','Date','កាលបរិច្ឆេទ')}">`;if(state.mode==='week')picker=`<span class="period-label">${isoWeek(state.ref)}</span><select data-filter="week" aria-label="${T('選週','Select week','ជ្រើសសប្ដាហ៍')}">${Array.from({length:21},(_,i)=>shiftPeriod('week',state.ref,i-10)).map(d=>`<option value="${d}" ${periodRange('week',d).from===r.from?'selected':''}>${isoWeek(d)} · ${d.slice(5)}</option>`).join('')}</select>`;if(state.mode==='month'||state.mode==='year'){picker=`<select data-filter="year" aria-label="${T('年份','Year','ឆ្នាំ')}">${years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select>`;if(state.mode==='month')picker+=`<select data-filter="month" aria-label="${T('月份','Month','ខែ')}">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===mo?'selected':''}>${new Intl.DateTimeFormat(state.lang==='zh'?'zh-TW':state.lang==='km'?'km-KH':'en-US',{month:'long',timeZone:'UTC'}).format(new Date(Date.UTC(y,i,1)))}</option>`).join('')}</select>`;}return `<div class="periodbar"><div class="segments" aria-label="${T('統計期間','Period','រយៈពេល')}">${[['day',T('日','Day','ថ្ងៃ')],['week',T('週','Week','សប្ដាហ៍')],['month',T('月','Month','ខែ')],['year',T('年','Year','ឆ្នាំ')]].map(([v,l])=>`<button class="${state.mode===v?'active':''}" data-period="${v}" aria-pressed="${state.mode===v}">${l}</button>`).join('')}</div><div class="periodnav">${button('','previous','left','square',`aria-label="${T('上一期','Previous period','រយៈពេលមុន')}"`)}${picker}${button('','next','chevron','square',`aria-label="${T('下一期','Next period','រយៈពេលបន្ទាប់')}"`)}${button(T('本期','Current','បច្ចុប្បន្ន'),'today',null,'small')}</div><span class="range">${r.from} — ${r.to} · ICT</span></div>`;}

function stats(){const m=metrics(rows()),value=x=>state.dataset==='empty'?'—':n(x);const values=[{label:T('本期工作紀錄','Records this period','កំណត់ត្រាក្នុងរយៈពេល'),v:value(m.total),icon:'clipboard',sub:T('按業務事件去重','Unique business events','កិច្ចការមិនស្ទួន'),action:'records'}, {label:T('待核可','Awaiting approval','រង់ចាំអនុម័ត'),v:value(m.pending),icon:'clock',sub:T('保留原審查與核可流程','Original review & approval flow','រក្សាលំហូរពិនិត្យ និងអនុម័តដើម'),action:'pending'}, {label:T('需關注事項','Needs attention','កិច្ចការត្រូវយកចិត្តទុកដាក់'),v:value(m.abnormal),icon:'alert',sub:T('異常集中追蹤','Issues in one place','តាមដានបញ្ហានៅកន្លែងតែមួយ'),action:'abnormal'}, {label:T('本期已完成','Completed this period','បានបញ្ចប់ក្នុងរយៈពេល'),v:value(m.completed),icon:'check',sub:T('點開核對明細與來源','Open details & source','បើកព័ត៌មានលម្អិត និងប្រភព'),action:'completed'}];return `<div class="stats">${values.map(v=>`<button class="stat" data-action="${v.action}"><div class="stat-head"><span>${v.label}</span>${I(v.icon)}</div><div class="stat-value">${v.v}</div><div class="stat-bottom">${v.sub}</div></button>`).join('')}</div>`;}
function taskLine(r){const m=MODULE_MAP[r.module];return `<button class="task-line" data-record="${esc(recordKey(r))}"><span class="task-icon ${r.status==='abnormal'?'red':r.status==='pending'?'amber':''}">${I(m.icon)}</span><span class="task-main"><strong>${esc(t(r.title))}</strong><small>${esc(t(m.name))} · ${esc(r.owner||'—')} · ${r.date.slice(5)} <span class="source-mini"> / ${SOURCES[r.source].name}</span></small></span>${statusPill(r.status)}${I('chevron')}</button>`;}
function trend(){const filtered=rows(),range=periodRange(state.mode,state.ref),from=new Date(range.from+'T00:00:00Z'),to=new Date(range.to+'T00:00:00Z');let buckets=[];if(state.mode==='year'){buckets=Array.from({length:12},(_,i)=>({label:`${i+1}`,key:range.from.slice(0,4)+'-'+String(i+1).padStart(2,'0')}));}else{const span=Math.round((to-from)/86400000)+1,step=span>14?Math.ceil(span/10):1;for(let i=0;i<span;i+=step){const a=new Date(+from+i*86400000).toISOString().slice(0,10),b=new Date(+from+Math.min(span-1,i+step-1)*86400000).toISOString().slice(0,10);buckets.push({label:a.slice(5),a,b});}}if(buckets.length===1){buckets=[{label:range.from.slice(5),a:range.from,b:range.to}];}for(const b of buckets){const list=filtered.filter(r=>b.key?r.date.startsWith(b.key):r.date>=b.a&&r.date<=b.b);b.total=list.length;b.bad=list.filter(r=>r.status==='abnormal').length;b.good=b.total-b.bad;}const max=Math.max(1,...buckets.map(b=>b.total));return `<section class="panel"><div class="panel-head"><div><h2>${T('工作紀錄趨勢','Activity trend','និន្នាការកំណត់ត្រា')}</h2><div class="panel-sub">${T('跟著所選日／週／月／年變動','Follows the selected day / week / month / year','ប្រែប្រួលតាមថ្ងៃ / សប្ដាហ៍ / ខែ / ឆ្នាំ')}</div></div><div class="chart-head-legend"><span><i class="legend-square"></i>${T('紀錄','Records','កំណត់ត្រា')}</span><span><i class="legend-square" style="background:#e5b297"></i>${T('異常','Issues','បញ្ហា')}</span></div></div>${state.dataset==='empty'?emptyState():`<div class="chart" role="img" aria-label="${esc(buckets.map(b=>`${b.label}: ${b.total}, ${statusText('abnormal')}: ${b.bad}`).join('; '))}">${buckets.map(b=>`<div class="chart-column"><span class="chart-number">${b.total||''}</span><div class="bars"><span class="bar" style="height:${b.good/max*100}%"></span><span class="bar alert" style="height:${b.bad/max*100}%"></span></div><label>${b.label}</label></div>`).join('')}</div><div class="chart-foot">${T('顯示事件筆數；金額、重量與數量分開統計。','Event counts only. Cost, weight and quantity are calculated separately.','បង្ហាញចំនួនកិច្ចការ។ ចំណាយ ទម្ងន់ និងបរិមាណគណនាដាច់ដោយឡែក។')}</div>`}</section>`;}

function table(list,full=false){const pages=Math.max(1,Math.ceil(list.length/20));state.page=Math.min(state.page,pages);const view=full?list.slice((state.page-1)*20,state.page*20):list.slice(0,6);if(!view.length)return `<div class="panel">${emptyState()}</div>`;return `<div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th><input type="checkbox" data-action="select-all" aria-label="${T('選取本頁','Select this page','ជ្រើសទំព័រនេះ')}" ${view.every(r=>state.selected.has(recordKey(r)))?'checked':''}></th><th>${T('工作／紀錄','Activity / record','កិច្ចការ / កំណត់ត្រា')}</th><th>${T('業務模組','Module','មុខងារ')}</th><th>${T('日期','Date','កាលបរិច្ឆេទ')}</th><th>${T('負責人','Owner','អ្នកទទួលខុសត្រូវ')}</th><th>${T('狀態','Status','ស្ថានភាព')}</th><th>${T('來源','Source','ប្រភព')}</th>${full&&state.dataset==='snapshot'?'<th>'+T('操作','Actions','សកម្មភាព')+'</th>':''}</tr></thead><tbody>${view.map(r=>`<tr data-record="${esc(recordKey(r))}" tabindex="0"><td><input type="checkbox" data-select="${esc(recordKey(r))}" ${state.selected.has(recordKey(r))?'checked':''} aria-label="${esc(r.id)}"></td><td class="title-cell">${esc(t(r.title))}<div class="row-code">${esc(r.id)}</div></td><td>${esc(t(MODULE_MAP[r.module].name))}</td><td class="date-cell">${r.date}</td><td>${esc(r.owner||'—')}</td><td>${statusPill(r.status)}</td><td class="source-mini">${SOURCES[r.source].name}${r.sourceRefs.length>1?` · ${r.sourceRefs.length} ${T('關聯','linked','តំណ')}`:''}</td>${full&&state.dataset==='snapshot'?`<td class="record-actions">${button(T('編輯','Edit','កែ'),'ledger-edit','edit','small',`data-key="${esc(recordKey(r))}"`)}</td>`:''}</tr>`).join('')}</tbody></table></div><div class="table-bottom"><span>${state.selected.size?`${state.selected.size} ${T('筆已選','selected','បានជ្រើស')} · `:''}${full?`${(state.page-1)*20+1}–${Math.min(state.page*20,list.length)} / ${list.length}`:`${T('顯示最近','Latest','ចុងក្រោយ')} ${view.length} / ${list.length}`} ${T('筆紀錄','records','កំណត់ត្រា')}</span>${full?`<div class="actions">${button('','page-prev','left','small',`aria-label="Previous page" ${state.page===1?'disabled':''}`)}<span>${state.page} / ${pages}</span>${button('','page-next','chevron','small',`aria-label="Next page" ${state.page===pages?'disabled':''}`)}</div>`:`<button class="text-link" data-route="records">${T('全部紀錄','All records','កំណត់ត្រាទាំងអស់')} ${I('chevron')}</button>`}</div></div>`;}

  }
  const k=recordKey({id,source:m.source,module:m.id});
  if(!old&&rawLedgerRow(k)){error(T('這個業務已有相同單號，請編輯原紀錄或到回收站還原。','This ID already exists. Edit it or restore it from the trash.','លេខនេះមានរួច។ សូមកែ ឬស្ដារពីធុងសំរាម។'));return;}
  if(cloudUI.hasConflict(k)){error(T('請先在紀錄頁選擇保留本機版或雲端版。','Choose the local or cloud version on the records page first.','សូមជ្រើសកំណែក្នុងម៉ាស៊ីន ឬពពកជាមុន។'));return;}
  const posted=!!el('posted')?.checked;
  if((qty&&!value('unit'))||(posted&&!amount)){error(T('有數量時請填單位；已入帳實支須填金額。','Quantity needs a unit; a posted expense needs an amount.','បរិមាណត្រូវការឯកតា។ ចំណាយបានចុះបញ្ជីត្រូវការចំនួនប្រាក់។'));return;}
  let row;
  try{
    row=normalizeCloudSnapshot({schemaVersion:1,generatedAt:new Date().toISOString(),records:[{...old,id,source:m.source,module:m.id,date,
      title:old&&title===t(old.title)?old.title:title,updatedAt:old?.updatedAt||ledgerNextStamp(),
      status:old?.requiresApproval?old.status:value('status'),owner:value('owner'),location:value('location'),notes:el('notes')?.value||'',
      amount:amount?Number(amount):undefined,currency:amount?value('currency'):undefined,posted,
      quantity:qty?Number(qty):undefined,unit:qty?value('unit'):undefined,relatedDocumentId:value('related'),attachments:urls,deleted:false}]}).records[0];
  }catch{error(T('資料格式不符，請核對日期、金額、數量和必填欄位。','Check the date, amount, quantity, and required fields.','សូមពិនិត្យកាលបរិច្ឆេទ ចំនួនប្រាក់ បរិមាណ និងវាលចាំបាច់។'));return;}
  if(old&&stableJSON(old)===stableJSON(row)){dialog.close();toast(T('沒有變更。','No changes.','គ្មានការផ្លាស់ប្តូរ។'));return;}
  row.updatedAt=ledgerNextStamp(old,cloudUI.serverRow(k));
  const ok=await cloudUI.saveRecords([row],{onStaged:()=>{
    state.ref=date;state.query='';state.status='all';state.page=1;ledgerEditing=null;dialog.close();
  }});
  if(!ok&&dialog.querySelector('#ledger-form'))error(T('無法儲存，請查看雲端狀態。','Save failed. Check the cloud status.','មិនអាចរក្សាទុកបាន។ សូមពិនិត្យស្ថានភាពពពក។'));
}
async function deleteLedger(keys){
  if(state.dataset!=='snapshot'||cloudUI.isBusy()||!cloudUI.ensureConnected())return;
  const candidates=[...new Set(keys)].map(rawLedgerRow).filter(row=>row&&!row.deleted&&inLedgerScope(row));
  if(!candidates.length)return;
  if(candidates.some(row=>cloudUI.hasConflict(recordKey(row)))){toast(T('請先處理紀錄衝突。','Resolve record conflicts first.','សូមដោះស្រាយជម្លោះជាមុន។'));return;}
  if(!confirm(T('將 '+candidates.length+' 筆紀錄移到 PSJGA 回收站？原系統不變。','Move '+candidates.length+' records to PSJGA trash? Original systems are unaffected.','ផ្លាស់ទី '+candidates.length+' កំណត់ត្រាទៅធុងសំរាម PSJGA?')))return;
  await cloudUI.saveRecords(candidates.map(row=>({...row,deleted:true,updatedAt:ledgerNextStamp(row)})),{onStaged:()=>dialog.close()});
}
function ledgerTrash(){

  openDialog(`<div class="dialog-head"><div><small>PSJGA</small><h2>${T('回收站','Trash','ធុងសំរាម')}</h2></div>${closeButton()}</div><div class="dialog-body cloud-dialog">
  <p>${T('已刪除紀錄不列入統計，可使用原單號還原。','Deleted records do not count in reports and can be restored with their original IDs.','កំណត់ត្រាលុបមិនរាប់ក្នុងរបាយការណ៍ ហើយអាចស្ដារវិញ។')}</p>
  ${removed.length?removed.slice(0,100).map(r=>`<div class="ledger-conflict-row"><div><strong>${esc(t(r.title))}</strong><small>${esc(r.id)}</small></div>${button(T('還原','Restore','ស្ដារ'),'ledger-restore',null,'small',`data-key="${esc(recordKey(r))}"`)}</div>`).join(''):T('沒有已刪除的紀錄。','No deleted records.','គ្មានកំណត់ត្រាលុប។')}${removed.length>100?T('顯示最近 100 筆。','Showing the 100 latest.','បង្ហាញ ១០០ ចុងក្រោយ។'):''}</div>`);
}
async function restoreLedger(key){
  const row=rawLedgerRow(key);
  if(state.dataset!=='snapshot'||!row?.deleted||!inLedgerScope(row)||cloudUI.hasConflict(key)||!cloudUI.ensureConnected())return;
  if(!confirm(T('還原這筆 PSJGA 紀錄？','Restore this PSJGA record?','ស្ដារកំណត់ត្រា PSJGA នេះ?')))return;
  await cloudUI.saveRecords([{...row,deleted:false,updatedAt:ledgerNextStamp(row)}],{onStaged:()=>dialog.close()});
}

function moduleTabs(m){

    <a href="#${m.id}" data-route="${m.id}" ${state.workspace?'aria-current="page"':''}>${I(m.icon)}${T('原系統作業','Operations','ប្រតិបត្តិការដើម')}</a>

function workspacePage(){
  const m=MODULE_MAP[state.workspace];
  return `<h1 class="visually-hidden">${esc(t(m.name))}</h1>${moduleTabs(m)}`;
}
function workspaceFrame(){
  const m=MODULE_MAP[state.workspace];
  return m?`<iframe title="${esc(t(m.name))}" src="${esc(m.url)}" referrerpolicy="no-referrer"></iframe>`:'';
}
function content(){
  if(state.workspace)return workspacePage();
  if(state.route==='overview')return overview();
  if(state.route==='tasks')return tasksPage();
  if(state.route==='records'||state.module||GROUPS.some(g=>g.id===state.route))return recordsPage();
  if(state.route==='reports')return reportsPage();
  if(state.route==='sources')return sourcesPage();
  if(state.route==='architecture')return architecturePage();
  return modulesPage();
}
let mountedWorkspace=null;
function render(){
  document.documentElement.lang=state.lang==='zh'?'zh-Hant':state.lang==='km'?'km':'en';
  document.body.style.overflow=state.menu?'hidden':'';
  document.title='VRT · '+(state.module?t(MODULE_MAP[state.module].name):T('總務整合工作台','General Affairs Workspace','ផ្ទាំងការងារកិច្ចការទូទៅ'));
  const view=app.querySelector?.('#ga-content');
  if(!view){app.innerHTML=shell();mountedWorkspace=state.workspace;return;}
  const sidebar=app.querySelector('#ga-sidebar'),main=app.querySelector('#main'),cloud=app.querySelector('#cloud-slot'),host=app.querySelector('#ga-workspace');
  sidebar.innerHTML=sideContent();sidebar.classList.toggle('open',state.menu);
  app.querySelector('.backdrop').classList.toggle('on',state.menu);
  app.querySelector('.topbar').innerHTML=topContent();
  app.querySelector('.mobile-nav').innerHTML=mobileContent();
  app.querySelector('.screen-footer').innerHTML=footer();
  view.innerHTML=content();
  cloud.hidden=!!state.workspace;cloud.innerHTML=cloudUI.toolbar();
  main.classList.toggle('is-original',!!state.workspace);
  host.hidden=!state.workspace;
  // Keep one original page mounted when the user looks at its ledger.
  if(state.workspace&&mountedWorkspace!==state.workspace){host.innerHTML=workspaceFrame();mountedWorkspace=state.workspace;}
}
function decodeRoute(path){
  if(typeof path!=='string')return null;
  const ledger=path.endsWith('/records'),name=ledger?path.slice(0,-8):path,mod=Object.hasOwn(MODULE_MAP,name)?name:null;
  if(ledger&&!mod||!Object.hasOwn(routeNames(),name))return null;
  return {name,mod,workspace:ledger?null:mod,path};
}
const currentPath=()=>state.module&&!state.workspace?state.route+'/records':state.route;
function route(path,{write=true}={}){
  const next=decodeRoute(path);if(!next)return;
  const same=next.path===currentPath();
  dialog.close();
  if(same){setMenu(false);return;}
  state.workspace=next.workspace;state.route=next.name;state.module=next.mod;state.menu=false;state.page=1;state.selected.clear();
  state.group=GROUPS.some(g=>g.id===next.name)?next.name:'all';state.status='all';state.query='';state.source='all';
  if(write)(history.pushState||history.replaceState).call(history,null,'','#'+next.path);
  render();window.scrollTo(0,0);
}
function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('on');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('on'),4000);}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

body=`<div style="padding:24px 0">${r.attachments.length?`<div class="attachments">${r.attachments.map((url,i)=>link(T('查看附件','Open evidence','បើកភស្តុតាង')+' '+(i+1),url)).join('')}</div>`:`<div class="empty-state">${I('camera')}<strong>${T('此筆預覽未附照片','No photos in this preview record','គ្មានរូបថតក្នុងកំណត់ត្រាមើលនេះ')}</strong><p>${T('原模組的照片功能仍保留；正式接入時帶入附件連結。','Original photo workflows remain available. Live adapters will provide attachment references.','មុខងាររូបថតដើមនៅរក្សា។ ការភ្ជាប់ទិន្នន័យពិតនឹងនាំចូលតំណឯកសារ។')}</p></div>`}</div>`;if(drawerTab==='source')body=`<div class="detail-grid">${f(T('原系統','Original system','ប្រព័ន្ធដើម'),SOURCES[r.source].name)}${f(T('原始 ID','Original ID','ID ដើម'),r.id)}${f(T('更新時間','Updated at','ពេលបច្ចុប្បន្នភាព'),r.updatedAt)}${f(T('已入帳實支','Posted actual expense','ចំណាយពិតបានចុះបញ្ជី'),r.posted?T('是','Yes','បាទ/ចាស'):T('否／其他業務階段','No / other workflow stage','ទេ / ដំណាក់កាលការងារផ្សេង'))}</div><div class="source-trace">${esc(r.sourceRefs.join('\n'))}${r.canonicalEventId?'\n\nEvent: '+esc(r.canonicalEventId):''}</div><p class="method-note">${T('相同來源與 ID 取最新版本；跨來源只依明確事件關聯去重。','Latest revision per source ID. Cross-source deduplication uses explicit event links.','យកកំណែថ្មីតាម ID ប្រភព។ បំបាត់ស្ទួនឆ្លងប្រភពដោយតំណកិច្ចការច្បាស់លាស់។')}</p>`;openDialog(base+body+`</div><div class="dialog-footer">${state.dataset==='snapshot'?button(T('編輯','Edit','កែ'),'ledger-edit','edit','primary',`data-key="${esc(recordKey(r))}"`)+button(T('刪除','Delete','លុប'),'ledger-delete','trash','danger',`data-key="${esc(recordKey(r))}"`):''}${link(T('另開原頁','Open original page','បើកទំព័រដើម'),m.url)}</div>`,true);}
function command(){openDialog(`<div class="dialog-head">${I('search')}<input class="command-input" id="command-input" placeholder="${T('搜尋功能、紀錄或單號…','Search tools, records or IDs…','ស្វែងរកមុខងារ កំណត់ត្រា ឬលេខ…')}" aria-label="Search">${closeButton()}</div><div class="dialog-body command-list" id="command-list"></div>`);updateCommand('');document.querySelector('#command-input').focus();}
function updateCommand(q){q=q.toLowerCase().trim();const mods=MODULES.filter(m=>[...Object.values(m.name),...Object.values(m.desc),m.id,m.source].join(' ').toLowerCase().includes(q));const records=q?eventRows(sources()).filter(r=>[r.id,t(r.title),r.owner].join(' ').toLowerCase().includes(q)).slice(0,8):[];document.querySelector('#command-list').innerHTML=mods.slice(0,12).map(m=>`<button class="command-result" style="width:100%;border:0;background:transparent;text-align:left;color:inherit" data-action="module" data-module="${m.id}">${I(m.icon)}${esc(t(m.name))}<small>${SOURCES[m.source].name}</small>${I('chevron')}</button>`).join('')+records.map(r=>`<button class="command-result" style="width:100%;border:0;background:transparent;text-align:left;color:inherit" data-command-record="${esc(recordKey(r))}">${I('file')}${esc(t(r.title))}<small>${esc(r.id)}</small></button>`).join('')+(!mods.length&&!records.length?`<p class="small-muted">${T('找不到相符項目','No matching results','រកមិនឃើញលទ្ធផលត្រូវគ្នា')}</p>`:'');}
function selectModule(id){if(Object.hasOwn(MODULE_MAP,id))route(id);}
function setMenu(open){
  state.menu=open;
  const sidebar=document.querySelector('.sidebar'),backdrop=document.querySelector('.backdrop');
  if(!sidebar||!backdrop){render();return;}
  sidebar.classList.toggle('open',open);backdrop.classList.toggle('on',open);
  app.querySelector('[aria-controls="ga-sidebar"]')?.setAttribute('aria-expanded',String(open));
  document.body.style.overflow=open?'hidden':'';
  if(open){sidebar.querySelector('[aria-current="page"]')?.scrollIntoView({block:'nearest'});}
}
const cloudUI=createCloudUI({state,storage,T,t,esc,I,button,dialog,closeButton,openDialog,render,toast,download});
const appearanceUI=createAppearanceUI({storage,T,dialog,openDialog,closeButton,toast});
async function action(a,el={}){
  if(a==='appearance'||a.startsWith('appearance-')){await appearanceUI.handle(a,el);return;}
  if(a==='cloud-export'){cloudUI.exportSnapshot({module:state.module,group:state.group});return;}
  if(a.startsWith('cloud-')){await cloudUI.handle(a);return;}
  if(a==='close'){dialog.close();return;}
  if(a==='module'){selectModule(el.dataset?.module);return;}
  if(a==='menu'||a==='menu-close'){setMenu(a==='menu'?!state.menu:false);return;}
  if(a==='command'){command();return;}
  if(a==='new'){ledgerEditor();return;}
  if(a==='ledger-edit'){ledgerEditor(el.dataset?.key);return;}
  if(a==='ledger-save'){await saveLedgerForm();return;}
  if(a==='ledger-delete'){await deleteLedger([el.dataset?.key]);return;}
  if(a==='ledger-delete-selected'){await deleteLedger([...state.selected]);return;}
  if(a==='ledger-trash'){ledgerTrash();return;}
  if(a==='ledger-restore'){await restoreLedger(el.dataset?.key);return;}
  if(a==='ledger-conflict-discard'){
    if(confirm(T('採用雲端版本，捨棄這筆本機修改？','Keep the cloud version and discard this local draft?','ប្រើកំណែពពក ហើយបោះបង់ការកែប្រែក្នុងម៉ាស៊ីន?'))&&cloudUI.discardConflict(el.dataset?.key))render();
    return;
  }
  if(a==='ledger-conflict-keep'){
    const key=el.dataset?.key,row=rawLedgerRow(key);
    if(row&&cloudUI.hasConflict(key)&&confirm(T('以本機版本更新這筆雲端紀錄？','Update this cloud record with the local version?','ធ្វើបច្ចុប្បន្នភាពកំណត់ត្រាពពកដោយកំណែក្នុងម៉ាស៊ីន?'))){
      await cloudUI.saveRecords([{...row,updatedAt:ledgerNextStamp(row,cloudUI.serverRow(key))}],{resolve:new Set([key])});
    }
    return;
  }
  if(a==='sources'||a==='records'){route(a);return;}
  if(['pending','abnormal','completed'].includes(a)){route(a==='pending'?'tasks':'records');state.status=a;render();return;}
  if(a==='previous'||a==='next'||a==='today'){state.ref=a==='today'?todayICT():shiftPeriod(state.mode,state.ref,a==='previous'?-1:1);state.page=1;state.selected.clear();render();return;}
  if(a==='demo'||a==='empty'){state.dataset=a==='empty'&&state.snapshot?'snapshot':a;state.page=1;state.selected.clear();storage.set('dataset',state.dataset);render();return;}
  if(a==='page-next'||a==='page-prev'){state.page+=a==='page-next'?1:-1;render();return;}
  if(a==='detail-prev'||a==='detail-next'){drawerIndex+=a==='detail-next'?1:-1;drawRecord();return;}
  if(a==='select-all'){const list=rows(),view=state.route==='overview'?list.slice(0,6):list.slice((state.page-1)*20,state.page*20);view.forEach(r=>el.checked?state.selected.add(recordKey(r)):state.selected.delete(recordKey(r)));render();return;}
  if(a==='export'){
    const all=rows(),list=state.selected.size?all.filter(r=>state.selected.has(recordKey(r))):all;
    if(!list.length){toast(T('此範圍沒有可匯出的紀錄','No records to export in this scope','គ្មានកំណត់ត្រាសម្រាប់នាំចេញក្នុងជម្រើសនេះ'));return;}
    download('PSJGA_'+(state.module||'records')+'_'+state.mode+'_'+state.ref+'.csv',ledgerCSV(list,state.lang),'text/csv;charset=utf-8');
    toast(T('已匯出所選範圍，含來源、單號和版本。','Exported the selected scope with sources, IDs, and revisions.','បាននាំចេញជម្រើសជាមួយប្រភព លេខ និងកំណែ។'));return;
  }
  if(a==='template'){download('VRT_GA_SAMPLE_snapshot.json',JSON.stringify(demo,null,2),'application/json');return;}
  if(a==='import'){
    if(cloudUI.isBusy()||!cloudUI.ensureConnected())return;
    openDialog(`<div class="dialog-head"><div><small>PSJGA</small><h2>${T('匯入總表紀錄','Import ledger records','នាំចូលកំណត់ត្រា')}</h2></div>${closeButton()}</div>
      <div class="dialog-body cloud-dialog"><p>${T('選擇 JSON 備份或 Excel 另存的 UTF-8 CSV。相同業務與單號會比對版本。','Choose a JSON backup or UTF-8 CSV saved from Excel. Existing records are matched by module and ID.','ជ្រើស JSON ឬ CSV UTF-8 ពី Excel។ ផ្គូផ្គងតាមមុខងារ និងលេខកំណត់ត្រា។')}</p>
      <p>${T('使用 CSV 範本時，日期請填 YYYY-MM-DD。匯入後可先核對，再按上傳。','In the CSV template, use YYYY-MM-DD for dates. Review imported rows before uploading.','ប្រើកាលបរិច្ឆេទ YYYY-MM-DD។ ពិនិត្យទិន្នន័យមុនផ្ទុក។')}</p>
      ${button(T('下載 CSV 範本','Download CSV template','ទាញយកគំរូ CSV'),'ledger-template','download','small')}</div>
      <div class="dialog-footer">${button(T('選擇檔案','Choose file','ជ្រើសឯកសារ'),'ledger-choose','upload','primary')}</div>`);
    return;
  }
  if(a==='ledger-template'){
    download('PSJGA_'+(state.module||'records')+'_template.csv',ledgerCSVTemplate(state.module),'text/csv;charset=utf-8');
    return;
  }
  if(a==='ledger-choose'){
    const module=state.module,group=state.group,input=document.createElement('input');input.type='file';input.accept='.json,.csv,application/json,text/csv';
    input.addEventListener('change',()=>{if(input.files[0]){dialog.close();void cloudUI.importSnapshot(input.files[0],{module,group});}},{once:true});
    input.click();return;
  }
}
document.addEventListener('submit',e=>{if(e.target.id==='ledger-form'){e.preventDefault();void saveLedgerForm();}});
document.addEventListener('click',e=>{const sel=e.target.closest('[data-select]');if(sel){sel.checked?state.selected.add(sel.dataset.select):state.selected.delete(sel.dataset.select);e.stopPropagation();render();return;}const lang=e.target.closest('[data-lang]');if(lang){state.lang=lang.dataset.lang;storage.set('lang',state.lang);render();return;}const period=e.target.closest('[data-period]');if(period){state.mode=period.dataset.period;state.page=1;state.selected.clear();render();return;}const tab=e.target.closest('[data-detail-tab]');if(tab){drawerTab=tab.dataset.detailTab;drawRecord();return;}const cmdRecord=e.target.closest('[data-command-record]');if(cmdRecord){const key=cmdRecord.dataset.commandRecord,found=eventRows(sources()).find(r=>recordKey(r)===key);if(found){route(found.module+'/records');state.ref=found.date;render();recordDialog(key);}return;}const routeEl=e.target.closest('[data-route]');if(routeEl){e.preventDefault();route(routeEl.dataset.route);return;}const actionEl=e.target.closest('[data-action]');if(actionEl){e.preventDefault();action(actionEl.dataset.action,actionEl);return;}const record=e.target.closest('[data-record]');if(record)recordDialog(record.dataset.record);});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='command-input')updateCommand(e.target.value);if(e.target.dataset.filter==='query'){state.query=e.target.value;clearTimeout(searchTimer);const pos=e.target.selectionStart;searchTimer=setTimeout(()=>{state.page=1;state.selected.clear();render();const input=document.querySelector('[data-filter=query]');if(input){input.focus();input.setSelectionRange(pos,pos);}},150);}});
document.addEventListener('change',e=>{const f=e.target.dataset.filter;if(!f)return;const v=e.target.value;if(f==='ledger-module'){if(v)route(v+'/records');return;}if(f==='date'||f==='week'){if(!v)return;try{periodRange('day',v);}catch{return;}state.ref=v;}else if(f==='year'){state.ref=v+'-'+(state.mode==='year'?'01':state.ref.slice(5,7))+'-01';}else if(f==='month'){state.ref=state.ref.slice(0,4)+'-'+v.padStart(2,'0')+'-01';}else state[f]=v;state.page=1;state.selected.clear();render();});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command();}if(e.key==='Escape'&&state.menu)setMenu(false);if(e.key==='Enter'&&e.target.matches('tr[data-record]'))recordDialog(e.target.dataset.record);});
dialog.addEventListener('click',e=>{if(e.target===dialog){const rect=dialog.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)dialog.close();}});
const start=decodeRoute(location.hash.slice(1));
if(start){state.route=start.name;state.workspace=start.workspace;state.module=start.mod;state.group=GROUPS.some(g=>g.id===start.name)?start.name:'all';}
render();void cloudUI.start(location.hash);
function followLocation(){
  const h=location.hash.slice(1);
  if(h.startsWith('pair=')||h==='phone'){void cloudUI.start(location.hash);return;}
  if((h||'overview')!==currentPath())route(h||'overview',{write:false});
}
window.addEventListener('hashchange',followLocation);
window.addEventListener('popstate',followLocation);

</script></body></html>
